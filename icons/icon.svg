<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FD3FF"/>
      <stop offset=".55" stop-color="#2F86FF"/>
      <stop offset="1" stop-color="#3A3FD9"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#B8F2FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#B8F2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8E7BFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8E7BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- glass rim: bright top-left, fading bottom-right -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".25"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="fillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="fillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#0B1E6B" flood-opacity=".32"/>
    </filter>
    <clipPath id="cBack"><rect x="250" y="236" width="520" height="360" rx="88" transform="rotate(-9 510 416)"/></clipPath>
    <clipPath id="cFront"><rect x="196" y="404" width="632" height="420" rx="100"/></clipPath>
    <g id="scene">
      <rect width="1024" height="1024" fill="url(#bg)"/>
      <circle cx="250" cy="230" r="330" fill="url(#glowA)"/>
      <circle cx="860" cy="860" r="380" fill="url(#glowB)"/>
      <circle cx="790" cy="250" r="260" fill="url(#glowA)" opacity=".55"/>
    </g>
  </defs>

  <use href="#scene"/>

  <!-- back card: frosted glass -->
  <g filter="url(#soft)">
    <g clip-path="url(#cBack)"><use href="#scene" filter="url(#frost)"/></g>
    <rect x="250" y="236" width="520" height="360" rx="88" transform="rotate(-9 510 416)" fill="url(#fillBack)"/>
  </g>
  <rect x="250" y="236" width="520" height="360" rx="88" transform="rotate(-9 510 416)" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- front card: frosted glass, slightly brighter -->
  <g filter="url(#soft)">
    <g clip-path="url(#cFront)">
      <use href="#scene" filter="url(#frost)"/>
      <rect x="196" y="404" width="632" height="420" fill="url(#fillFront)"/>
      <!-- specular sheen across the upper third -->
      <path d="M196 404h632v150c-210 40-420 40-632 0z" fill="url(#sheen)" opacity=".4"/>
    </g>
  </g>
  <rect x="196" y="404" width="632" height="420" rx="100" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- card content: question line + answer lines -->
  <rect x="286" y="540" width="300" height="40" rx="20" fill="#FFFFFF" fill-opacity=".96"/>
  <rect x="286" y="622" width="452" height="30" rx="15" fill="#FFFFFF" fill-opacity=".62"/>
  <rect x="286" y="690" width="350" height="30" rx="15" fill="#FFFFFF" fill-opacity=".62"/>
</svg>
