  // menus
  function openMenu(trigger, items){
    closeMenu();
    var ov = document.createElement("div");
    ov.className = "menu glass sq"; ov.setAttribute("role", "menu");
    ov.innerHTML = items.map(function(it){
      if (it === "-") return "<hr>";
      return '<button role="menuitem" class="' + (it.destructive ? "destructive" : "") + '" data-menu="' + it.id + '">' + esc(it.label) + icon(it.icon) + '</button>';
    }).join("");
    document.body.appendChild(ov);
    var r = trigger.getBoundingClientRect(), mw = ov.offsetWidth, mh = ov.offsetHeight;
    var left = Math.min(Math.max(12, r.right - mw), window.innerWidth - mw - 12);
    var top = r.bottom + 8;
    if (top + mh > window.innerHeight - 12) top = Math.max(12, r.top - mh - 8);
    ov.style.left = left + "px"; ov.style.top = top + "px";
    ov.style.transformOrigin = (r.left + r.width / 2 - left) + "px " + (r.top + r.height / 2 - top) + "px";
    S.menu = { el: ov, items: items, trigger: trigger };
    requestAnimationFrame(function(){ ov.classList.add("show"); var f = ov.querySelector("button"); if (f) f.focus(); });
  }
  function closeMenu(restore){
    if (!S.menu) return;
    var m = S.menu; S.menu = null;

    t.innerHTML = '<span>' + esc(msg) + '</span>' + (actionLabel ? '<button class="btn small" data-action="toast-action">' + esc(actionLabel) + '</button>' : '');
    requestAnimationFrame(function(){ t.classList.add("show"); });

  function deleteCardWithUndo(d, cardId){
    var idx = -1;
    d.cards.forEach(function(c, i){ if (c.id === cardId) idx = i; });
    if (idx < 0) return;
    var removed = d.cards.splice(idx, 1)[0];
    saveDeck(d, ["cards"]);
    renderShell();
    toast("Karte gelöscht", "Widerrufen", function(){
      var dd = getDeck(d.id); if (!dd) return;
      dd.cards.splice(Math.min(idx, dd.cards.length), 0, removed);
      saveDeck(dd, ["cards"]); renderShell();
    });
  }

  function exportData(){
    var payload = { app: "karteikasten", version: 2, exportedAt: new Date().toISOString(),
      decks: S.decks.map(function(d){ return { name: d.name, color: d.color, cards: d.cards }; }) };
    var json = JSON.stringify(payload, null, 2);
    var filename = "karteikasten-" + today() + ".json";
    if (S.downloads){
      S.downloads.save({ filename: filename, data: json }).then(function(){ toast("Sicherung gespeichert"); }).catch(function(err){
        if (err && err.code === "cancelled") return;
        toast("Sicherung konnte nicht gespeichert werden.");
      });
      return;
    }
    if (IS_ARTIFACT){ toast("Herunterladen ist in dieser Ansicht nicht möglich."); return; }
    var blob = new Blob([json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast("Sicherung gespeichert");
  }
  function importFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); } catch (e) { toast("Die Datei ist keine gültige Sicherung."); return; }
      var decks = data && Array.isArray(data.decks) ? data.decks : (Array.isArray(data) ? data : null);
      if (!decks || !decks.length){ toast("In der Datei wurden keine Fächer gefunden."); return; }
      var jobs = decks.map(function(d){
        var cards = (Array.isArray(d.cards) ? d.cards : []).filter(function(c){ return c && c.q && c.a; }).map(function(c){
          var nc = normalizeCard({ id: uid(), q: String(c.q).slice(0, 300), a: String(c.a).slice(0, 500), mastered: !!c.mastered, box: c.box, due: c.due });
          if (c.media && c.media.kind === "svg" && sanitizeSvg(c.media.markup)) nc.media = { kind: "svg", markup: sanitizeSvg(c.media.markup), alt: c.media.alt || "Grafik" };
          else if (c.media && c.media.kind === "photo" && safeUrl(c.media.url)) nc.media = { kind: "photo", url: safeUrl(c.media.url), assetId: c.media.assetId, alt: c.media.alt || "Notizfoto" };
          return nc;
        });
        return createDeck({ name: String(d.name || "Importiert").slice(0, 40), color: colorKey(d.color), cards: cards });
      });
      Promise.all(jobs).then(function(){ toast(plural(decks.length, "Fach", "Fächer") + " importiert"); renderShell(); })
        .catch(function(){ toast("Import fehlgeschlagen. Versuch es erneut."); });
    };
    reader.readAsText(file);
  }

  function runGenText(){
    var g = S.gen;
    var text = (g.text || "").trim();
    if (!text){ var ta = $("genText"); if (ta) ta.focus(); return; }
    g.busy = true; g.error = ""; renderSheetBody();
    aiJson(GEN_PROMPT_HEAD + text.slice(0, 6000) + '\n"""').then(function(result){
      var cleaned = cleanDraftArray(result);
      if (!cleaned.length) throw { code: "invalid_json" };
      g.busy = false; g.draft = cleaned; g.draftKind = "text"; g.draftPhotos = [];
      if (S.sheet && S.sheet.id === "gen") renderSheetBody();
    }).catch(function(err){
      g.busy = false; g.error = aiErrorMessage(err && err.code);
      if (S.sheet && S.sheet.id === "gen") renderSheetBody();
    });
  }
  function runGenPhoto(){
    var g = S.gen;
    if (!g.photos.length) return;
    g.busy = true; g.error = ""; renderSheetBody();
    var files = g.photos.map(function(p){ return p.file; });
    aiJson(PHOTO_PROMPT, files).then(function(result){
      var cleaned = cleanDraftArray(result);
      if (!cleaned.length) throw { code: "invalid_json" };
      g.busy = false; g.draft = cleaned; g.draftKind = "photo";
      g.draftPhotos = files; g.draftPrimary = Math.min(g.primary, files.length - 1); g.attach = true;
      if (S.sheet && S.sheet.id === "gen") renderSheetBody();
    }).catch(function(err){
      g.busy = false; g.error = aiErrorMessage(err && err.code);
      if (S.sheet && S.sheet.id === "gen") renderSheetBody();
    });
  }
  function commitDraft(){
    var g = S.gen, d = getDeck(S.sheet.deckId);
    if (!d || g.committing) return;
    var draft = g.draft.filter(function(x){ return x.q.trim() && x.a.trim(); });
    if (!draft.length){ g.draft = []; renderSheetBody(); return; }
    g.committing = true; renderSheetBody();
    var needsPhoto = g.draftKind === "photo" && g.attach && g.draftPhotos.length && draft.some(function(x){ return !x.svg; });
    var photoP = Promise.resolve(null);
    if (needsPhoto){
      var file = g.draftPhotos[Math.min(g.draftPrimary || 0, g.draftPhotos.length - 1)];
      if (S.storage === "cloud" && S.assets){
        photoP = S.assets.upload(file).then(function(res){ return { assetId: res.id, url: res.url }; }).catch(function(err){ console.error(err); return null; });
      } else if (S.storage !== "cloud"){
        photoP = fileToJpeg(file, 1200, .8).then(function(u){ return { url: u }; }).catch(function(){ return null; });
      }
    }
    photoP.then(function(photo){
      var dd = getDeck(d.id) || d;
      var cards = draft.map(function(x){
        var m = null;
        if (x.svg) m = { kind: "svg", markup: x.svg, alt: "Grafik" };
        else if (photo) m = { kind: "photo", assetId: photo.assetId, url: photo.url, alt: "Notizfoto" };
        if (m && !m.assetId) delete m.assetId;
        return newCard(x.q.trim(), x.a.trim(), m);
      });
      dd.cards = dd.cards.concat(cards);
      saveDeck(dd, ["cards"]);
      S.gen = null;
      closeSheet();
      renderShell();
      toast(plural(cards.length, "Karte", "Karten") + " hinzugefügt");
    });
  }

      if (mi){ menuActions[mi.getAttribute("data-menu")](trig); return; }
      if (trig && trig.contains(e.target)) return;
    }
    var el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    var fn = actions[el.getAttribute("data-action")];
    if (fn){ e.preventDefault(); fn(el, e); }
  });
  document.addEventListener("input", function(e){
    var t = e.target;
    if (t.id === "sideSearch" || t.id === "tabSearch"){
      S.query = t.value;
      if (S.tab !== "search"){ S.tab = "search"; S.deckId = null; renderSidebar(); renderTabbar(); }
      renderView();
      return;
    }
    if (!S.sheet) {
      if (t.id === "apiKey"){ settings.apiKey = t.value.trim(); saveSettings(); }
      return;
    }
    if (t.id === "deckName"){ S.sheet.name = t.value; $("saveDeckBtn").disabled = !t.value.trim(); }
    if (t.id === "cardQ" || t.id === "cardA"){
      S.sheet[t.id === "cardQ" ? "q" : "a"] = t.value;
      $("saveCardBtn").disabled = !((S.sheet.q || "").trim() && (S.sheet.a || "").trim());
      var st = $("cardStatus"); if (st && st.textContent){ st.textContent = ""; S.sheet.status = ""; }
    }
    if (t.getAttribute("data-gen") === "text") S.gen.text = t.value;
    if (t.hasAttribute("data-draft")) S.gen.draft[+t.getAttribute("data-i")][t.getAttribute("data-draft")] = t.value;
  });
  document.addEventListener("change", function(e){
    var t = e.target;
    if (t.hasAttribute("data-setting")){ settings[t.getAttribute("data-setting")] = t.checked; saveSettings(); }
    if (t.getAttribute("data-gen") === "attach") S.gen.attach = t.checked;
    if (t.id === "photoInput"){
      var max = maxPhotos();
      Array.prototype.slice.call(t.files || []).forEach(function(f){
        if (S.gen && S.gen.photos.length < max) S.gen.photos.push({ file: f, url: URL.createObjectURL(f) });
      });
      t.value = "";
      if (S.sheet && S.sheet.id === "gen") renderSheetBody();
    }
    if (t.id === "importInput"){ if (t.files && t.files[0]) importFile(t.files[0]); t.value = ""; }
  });
  document.addEventListener("keydown", function(e){
    if (S.menu){
      if (e.key === "Escape"){ e.preventDefault(); closeMenu(true); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        var btns = Array.prototype.slice.call(S.menu.el.querySelectorAll("button"));
        var i = btns.indexOf(document.activeElement);
        i = e.key === "ArrowDown" ? (i + 1) % btns.length : (i - 1 + btns.length) % btns.length;
        btns[i].focus(); e.preventDefault();
      }
      return;
    }
    if (S.sheet){
      if (e.key === "Escape"){ e.preventDefault(); closeSheet(); return; }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){
        var p = document.querySelector("#sheet .hbtn.primary, #sheet [data-action='gen-run']");
        if (p && !p.disabled) p.click();
      }
      if (e.key === "Tab") trapFocus(e, $("sheet"));
      return;
    }
    if (S.session){
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.key === "Escape"){ e.preventDefault(); closeSession(); return; }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); return; }
      if (S.session.done) return;
      if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown"){ e.preventDefault(); flipCard(); return; }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
        e.preventDefault();
        if (!S.session.flipped){ flipCard(); return; }
        answer(e.key === "ArrowRight");
      }
      if (e.key === "Tab") trapFocus(e, $("learn"));
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f" && isWide()){ e.preventDefault(); $("sideSearch").focus(); }
  });
  function trapFocus(e, root){
    if (!root) return;
    var f = Array.prototype.slice.call(root.querySelectorAll("button:not([disabled]), input, textarea, [tabindex='0']")).filter(function(x){ return x.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  document.addEventListener("contextmenu", function(e){
    var row = e.target.closest(".swipe");
    if (!row) return;
    e.preventDefault();
    var deckId = row.getAttribute("data-deck"), cardId = row.getAttribute("data-card");
    var trig = row.querySelector(".row");
    var anchor = { getBoundingClientRect: function(){ return { left: e.clientX, right: e.clientX + 1, top: e.clientY, bottom: e.clientY, width: 1, height: 1 }; }, focus: function(){ trig.focus(); }, contains: function(){ return false; } };
    openMenu(anchor, [
      { id: "ctx-edit", label: "Bearbeiten", icon: "pencil" },
      "-",
      { id: "ctx-delete", label: "Löschen", icon: "trash", destructive: true }
    ]);
    menuActions["ctx-edit"] = function(){ openSheet("card", { deckId: deckId, cardId: cardId }, trig); };
    menuActions["ctx-delete"] = function(){ deleteCardWithUndo(getDeck(deckId), cardId); };
  });

  // swipe-to-delete on card rows
  var swipeState = null;
  function closeSwipe(sw){ var r = sw.querySelector(".row"); r.style.transform = ""; sw.classList.remove("open"); sw.querySelector(".swipe-actions").setAttribute("aria-hidden", "true"); }
  document.addEventListener("pointerdown", function(e){
    var open = document.querySelector(".swipe.open");
    if (open && !open.contains(e.target)) closeSwipe(open);
    var sw = e.target.closest(".swipe");
    if (!sw || e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest(".swipe-actions")) return;
    swipeState = { sw: sw, x: e.clientX, y: e.clientY, dx: 0, base: sw.classList.contains("open") ? -168 : 0, active: false, id: e.pointerId };
  });
  document.addEventListener("pointermove", function(e){
    var st = swipeState; if (!st || e.pointerId !== st.id) return;
    var mx = e.clientX - st.x, my = e.clientY - st.y;
    if (!st.active){
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.2){ st.active = true; st.sw.classList.add("dragging"); }
      else if (Math.abs(my) > 10){ swipeState = null; return; }
      else return;
    }
    st.dx = Math.min(0, st.base + mx);
    st.sw.querySelector(".row").style.transform = "translateX(" + st.dx + "px)";
  });
  document.addEventListener("pointerup", function(){
    var st = swipeState; swipeState = null;
    if (!st || !st.active) return;
    var sw = st.sw, row = sw.querySelector(".row");
    sw.classList.remove("dragging");
    sw.dataset.justSwiped = "1"; setTimeout(function(){ delete sw.dataset.justSwiped; }, 60);
    if (st.dx < -Math.max(220, sw.offsetWidth * .6)){
      row.style.transform = "translateX(-100%)";
      haptic(12);
      setTimeout(function(){ deleteCardWithUndo(getDeck(sw.getAttribute("data-deck")), sw.getAttribute("data-card")); }, 200);
    } else if (st.dx < -60){
      row.style.transform = "translateX(-168px)"; sw.classList.add("open");
      sw.querySelector(".swipe-actions").setAttribute("aria-hidden", "false");
    } else closeSwipe(sw);
  });
  document.addEventListener("click", function(e){
    var sw = e.target.closest(".swipe");
    if (sw && sw.dataset.justSwiped){ e.stopPropagation(); e.preventDefault(); }
  }, true);

  // scroll: large title -> inline title; tab bar minimizes while scrolling down
  var lastY = 0;
  window.addEventListener("scroll", function(){
    var y = window.scrollY;
    $("navbar").classList.toggle("scrolled", y > 44);
    var tb = $("tabbarWrap");
    if (y > lastY + 6 && y > 80) tb.classList.add("min");
    else if (y < lastY - 6 || y < 40) tb.classList.remove("min");
    lastY = y;
  }, { passive: true });
  var wideMq = window.matchMedia("(min-width: 900px)");
  (wideMq.addEventListener ? wideMq.addEventListener.bind(wideMq, "change") : wideMq.addListener.bind(wideMq))(function(){ renderShell(); });
  window.addEventListener("resize", function(){ if (S.menu) closeMenu(); });

  // ======================================================================
  // Boot
  // ======================================================================
  function start(hot){
    if (hot && hot.tab) S.tab = hot.tab;
    if (hot && hot.deckId) S.deckId = hot.deckId;
    renderShell();
    bootStorage();
  }
  if (IS_ARTIFACT && window.claude.hot && typeof window.claude.hot.snapshot === "function"){
    window.claude.hot.snapshot(function(){ return { tab: S.tab, deckId: S.deckId }; });
  }
  if (IS_ARTIFACT && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(IS_ARTIFACT && window.claude.hot ? window.claude.hot.data : null);

  if (!IS_ARTIFACT && "serviceWorker" in navigator && /^https:|^http:\/\/localhost/.test(location.href)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
<!-- APP:END -->
