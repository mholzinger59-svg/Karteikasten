<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!-- APP:START -->
<title>Karteikasten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iPhone = large title + inset-grouped content + floating glass tab bar;
   iPad/Mac (>=900px) = floating glass sidebar + content under a glass toolbar.
   Glass only on the function layer (bars, floating buttons, menus, sheets). */
:root{
  /* semantic system colors, light */
  --bg:#F2F2F7;               /* systemGroupedBackground */
  --bg-2:#FFFFFF;             /* secondarySystemGroupedBackground */
  --bg-3:#F2F2F7;             /* tertiarySystemGroupedBackground */
  --fill:rgba(120,120,128,.16);
  --fill-2:rgba(120,120,128,.10);
  --label:#000000;
  --label-2:rgba(60,60,67,.76);
  --label-3:rgba(60,60,67,.42);
  --separator:rgba(60,60,67,.24);
  --accent:#0071E3;           /* systemBlue, contrast-adjusted for 4.5:1 */
  --on-accent:#FFFFFF;
  --accent-soft:rgba(0,113,227,.12);
  --green:#1F8A3B;
  --red:#D70015;
  --orange:#C25E00;
  --dim:rgba(0,0,0,.22);
  /* glass */
  --glass-fill:rgba(255,255,255,.58);
  --glass-fill-strong:rgba(250,250,252,.86);
  --glass-edge:rgba(255,255,255,.85);
  --glass-rim:rgba(0,0,0,.06);
  --glass-shadow:0 8px 30px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  --glass-blur:blur(18px) saturate(190%);
  /* deck (content) colors */
  --c-blue:#007AFF; --c-green:#28A745; --c-orange:#FF9500; --c-red:#FF3B30; --c-purple:#AF52DE;
  --c-pink:#FF2D55; --c-teal:#30B0C7; --c-indigo:#5856D6; --c-yellow:#E6B800; --c-gray:#8E8E93;
  /* type (Dynamic Type via rem; 1rem = Body 17pt) */
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-serif:"New York", ui-serif, Georgia, serif;
  --t-large:2rem; --t-title1:1.647rem; --t-title2:1.294rem; --t-title3:1.176rem;
  --t-body:1rem; --t-callout:.941rem; --t-sub:.882rem; --t-foot:.765rem; --t-cap:.706rem; --t-cap2:.647rem;
  /* geometry */
  --r-sheet:34px; --r-group:22px; --r-card:28px; --r-ctl:12px;
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-bounce:cubic-bezier(.34,1.36,.64,1);
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
    --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.24);
    --label:#FFFFFF; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.36);
    --separator:rgba(84,84,88,.65);
    --accent:#0A84FF; --on-accent:#FFFFFF; --accent-soft:rgba(10,132,255,.2);
    --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --dim:rgba(0,0,0,.45);
    --glass-fill:rgba(44,44,48,.52); --glass-fill-strong:rgba(36,36,40,.9);
    --glass-edge:rgba(255,255,255,.16); --glass-rim:rgba(0,0,0,.4);
    --glass-shadow:0 8px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    --c-blue:#0A84FF; --c-green:#30D158; --c-orange:#FF9F0A; --c-red:#FF453A; --c-purple:#BF5AF2;
    --c-pink:#FF375F; --c-teal:#40C8E0; --c-indigo:#5E5CE6; --c-yellow:#FFD60A; --c-gray:#98989D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
  --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.24);
  --label:#FFFFFF; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.36);
  --separator:rgba(84,84,88,.65);
  --accent:#0A84FF; --on-accent:#FFFFFF; --accent-soft:rgba(10,132,255,.2);
  --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --dim:rgba(0,0,0,.45);
  --glass-fill:rgba(44,44,48,.52); --glass-fill-strong:rgba(36,36,40,.9);
  --glass-edge:rgba(255,255,255,.16); --glass-rim:rgba(0,0,0,.4);
  --glass-shadow:0 8px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
  --c-blue:#0A84FF; --c-green:#30D158; --c-orange:#FF9F0A; --c-red:#FF453A; --c-purple:#BF5AF2;
  --c-pink:#FF375F; --c-teal:#40C8E0; --c-indigo:#5E5CE6; --c-yellow:#FFD60A; --c-gray:#98989D;
  color-scheme:dark;
}
/* Glass intensity: "getönt" = more opaque fill */
:root[data-glass="tinted"]{ --glass-fill:rgba(255,255,255,.84); }
@media (prefers-color-scheme: dark){ :root[data-glass="tinted"]:not([data-theme="light"]){ --glass-fill:rgba(36,36,40,.86); } }
:root[data-glass="tinted"][data-theme="dark"]{ --glass-fill:rgba(36,36,40,.86); }
@media (prefers-contrast: more){
  :root{ --label-2:rgba(60,60,67,.92); --separator:rgba(60,60,67,.5); --glass-rim:rgba(0,0,0,.35); --glass-fill:rgba(255,255,255,.92); --accent:#0040DD; }
  :root[data-theme="dark"]{ --label-2:rgba(235,235,245,.85); --separator:rgba(140,140,148,.8); --glass-rim:rgba(255,255,255,.4); --glass-fill:rgba(28,28,30,.95); --accent:#409CFF; }
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ font-size:17px; -webkit-text-size-adjust:100%; }
@supports (font: -apple-system-body){ html{ font:-apple-system-body; } }
body{
  margin:0; min-height:100%;
  background:var(--bg); color:var(--label);
  font-family:var(--font); font-size:var(--t-body); line-height:1.3;
  -webkit-font-smoothing:antialiased;
}
button, input, textarea, select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:inherit; }
.sr{ position:absolute!important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
svg.i{ width:1.25em; height:1.25em; flex:none; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
svg.i .f{ fill:currentColor; stroke:none; }

/* ---------- Liquid Glass (function layer only) ---------- */
.glass{
  background:var(--glass-fill);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 .5px var(--glass-rim), var(--glass-shadow);
}
.glass-strong{ background:var(--glass-fill-strong); }
@media (prefers-reduced-transparency: reduce){
  .glass{ background:var(--bg-2) !important; -webkit-backdrop-filter:none; backdrop-filter:none; }
}
:root[data-transparency="reduce"] .glass{ background:var(--bg-2) !important; -webkit-backdrop-filter:none; backdrop-filter:none; }
@supports (corner-shape: squircle){
  .sq{ corner-shape:squircle; }
}

/* ---------- app frame ---------- */
#app{ min-height:100vh; }
.content{
  padding-left:var(--gutter-l); padding-right:var(--gutter-r);
  padding-block:calc(env(safe-area-inset-top, 0px) + 56px) calc(env(safe-area-inset-bottom, 0px) + 120px);
}
.content-inner{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:28px; }
.large-title{
  font-family:var(--font-display); font-size:var(--t-large); font-weight:700; letter-spacing:.01em;
  margin:0; line-height:1.15; text-wrap:balance; overflow-wrap:anywhere;
}
.title-block{ display:flex; flex-direction:column; gap:4px; }
.subtitle{ color:var(--label-2); font-size:var(--t-sub); margin:0; }

/* nav bar: floating glass controls + scroll-edge softening (no glass slab) */
.navbar{
  position:fixed; top:0; left:0; right:0; z-index:30;
  padding:calc(env(safe-area-inset-top, 0px) + 6px) var(--gutter-r) 6px var(--gutter-l);
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px;
  pointer-events:none;
}
.navbar::before{
  content:""; position:absolute; inset:0 0 -24px 0; z-index:-1; pointer-events:none;
  background:linear-gradient(var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 55%, transparent);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent);
  opacity:0; transition:opacity .25s ease;
}
.navbar.scrolled::before{ opacity:1; }
.nav-lead, .nav-trail{ display:flex; gap:8px; pointer-events:auto; }
.nav-trail{ justify-content:flex-end; }
.nav-title{
  font-weight:600; font-size:var(--t-body); text-align:center; opacity:0; transform:translateY(6px);
  transition:opacity .2s ease, transform .3s var(--spring); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw;
}
.navbar.scrolled .nav-title{ opacity:1; transform:none; }
.gbtn{
  min-width:44px; height:44px; border-radius:22px; border:none; padding:0 12px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--label);
  font-weight:500; transition:transform .35s var(--spring-bounce);
}
.gbtn:active{ transform:scale(.92); }
.gbtn.accent{ color:var(--accent); }
.gbtn svg.i{ width:1.3rem; height:1.3rem; }
.ggroup{ display:inline-flex; border-radius:22px; }
.ggroup .gbtn{ background:transparent; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; }

/* tab bar (iPhone): glass capsule + separate search circle */
.tabbar-wrap{
  position:fixed; z-index:40; left:0; right:0; bottom:0;
  padding:0 var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gutter-l);
  display:flex; align-items:flex-end; justify-content:center; gap:10px; pointer-events:none;
}
.tabbar{ pointer-events:auto; display:flex; gap:2px; padding:4px; border-radius:32px; transition:padding .35s var(--spring); }
.tab{
  border:none; background:transparent; border-radius:28px; min-width:76px; min-height:54px; padding:6px 12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--label); font-size:var(--t-cap2); font-weight:600; transition:background .25s ease, min-height .35s var(--spring), min-width .35s var(--spring);
}
.tab svg.i{ width:1.45rem; height:1.45rem; }
.tab[aria-selected="true"]{ color:var(--accent); background:var(--fill-2); }
.search-orb{ pointer-events:auto; width:62px; height:62px; border-radius:31px; border:none; display:flex; align-items:center; justify-content:center; color:var(--label); transition:width .35s var(--spring), height .35s var(--spring); }
.search-orb[aria-selected="true"]{ color:var(--accent); }
.search-orb svg.i{ width:1.45rem; height:1.45rem; }
.tabbar-wrap.min .tab{ min-height:40px; min-width:56px; }
.tabbar-wrap.min .tab span{ display:none; }
.tabbar-wrap.min .search-orb{ width:48px; height:48px; }
.searchbar{ pointer-events:auto; flex:1; max-width:560px; display:flex; align-items:center; gap:8px; height:52px; border-radius:26px; padding:0 8px 0 16px; }
.searchbar input{ flex:1; min-width:0; border:none; background:transparent; outline:none; font-size:var(--t-body); height:44px; }
.searchbar input::placeholder{ color:var(--label-2); }
.searchbar svg.i{ color:var(--label-2); }

/* sidebar (iPad/Mac) */
.sidebar{ display:none; }
@media (min-width:900px){
  .sidebar{
    display:flex; flex-direction:column; gap:14px; position:fixed; z-index:35;
    top:calc(env(safe-area-inset-top, 0px) + 10px); bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
    left:max(10px, env(safe-area-inset-left, 0px)); width:290px; border-radius:26px; padding:14px 10px; overflow:auto;
  }
  .tabbar-wrap{ display:none; }
  .content{ padding-left:calc(max(10px, env(safe-area-inset-left, 0px)) + 290px + 32px); padding-right:32px; padding-bottom:48px; }
  .navbar{ left:calc(max(10px, env(safe-area-inset-left, 0px)) + 290px); padding-left:22px; padding-right:22px; }
  .only-narrow{ display:none !important; }
}
@media (max-width:899.98px){ .only-wide{ display:none !important; } }
.side-search{ display:flex; align-items:center; gap:8px; height:40px; border-radius:20px; padding:0 12px; background:var(--fill-2); margin:0 4px; }
.side-search input{ flex:1; min-width:0; border:none; background:transparent; outline:none; }
.side-search svg.i{ color:var(--label-2); }
.side-section{ display:flex; flex-direction:column; gap:2px; }
.side-head{ font-size:var(--t-foot); font-weight:600; color:var(--label-2); padding:8px 12px 4px; }
.side-item{
  border:none; background:transparent; text-align:left; display:flex; align-items:center; gap:10px;
  min-height:44px; padding:8px 12px; border-radius:14px; font-size:var(--t-body); color:var(--label); width:100%;
}
.side-item:hover{ background:var(--fill-2); }
.side-item[aria-current="true"]{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.side-item .count{ margin-left:auto; color:var(--label-2); font-size:var(--t-sub); font-variant-numeric:tabular-nums; }
.side-item svg.i{ color:var(--accent); }
.side-item .deck-icon svg.i{ color:#fff; }
.side-item[aria-current="true"] .count{ color:var(--accent); }
.side-item .txt{ min-width:0; overflow-wrap:anywhere; }

/* ---------- content layer ---------- */
.section{ display:flex; flex-direction:column; gap:8px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:0 4px; flex-wrap:wrap; }
.section-head h2{ margin:0; font-family:var(--font-display); font-size:var(--t-title3); font-weight:700; }
.section-head .meta{ color:var(--label-2); font-size:var(--t-sub); }
.section-foot{ color:var(--label-2); font-size:var(--t-foot); padding:0 16px; margin:0; line-height:1.4; }
.group{ background:var(--bg-2); border-radius:var(--r-group); overflow:hidden; }
.row{
  position:relative; display:flex; align-items:center; gap:12px; min-height:52px; padding:11px 16px;
  width:100%; border:none; background:var(--bg-2); text-align:left; color:var(--label);
}
button.row:active, .row.tappable:active{ background:var(--fill-2); }
.row + .row::before, .swipe + .swipe::before, .row + .swipe::before, .swipe + .row::before{
  content:""; position:absolute; top:0; right:0; left:var(--sep-inset, 16px); height:.5px; background:var(--separator); z-index:2;
}
.row .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.row .t{ font-size:var(--t-body); overflow-wrap:anywhere; }
.row .t.strong{ font-weight:600; }
.row .s{ font-size:var(--t-sub); color:var(--label-2); overflow-wrap:anywhere; }
.row .s.clamp{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .trail{ color:var(--label-2); font-size:var(--t-body); display:flex; align-items:center; gap:6px; flex:none; font-variant-numeric:tabular-nums; }
.row .chev{ color:var(--label-3); width:1rem; height:1rem; }
.row.accent-row{ color:var(--accent); }
.row.destructive{ color:var(--red); justify-content:center; }
.deck-icon{ width:2.1rem; height:2.1rem; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; }
.deck-icon svg.i{ width:1.2rem; height:1.2rem; stroke-width:2.1; }
.deck-row{ --sep-inset:calc(16px + 2.1rem + 12px); }
.mini-progress{ height:4px; border-radius:2px; background:var(--fill); overflow:hidden; margin-top:6px; }
.mini-progress > i{ display:block; height:100%; border-radius:2px; background:var(--green); }
.pill{ display:inline-flex; align-items:center; gap:4px; font-size:var(--t-foot); font-weight:600; padding:3px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
.pill.neutral{ background:var(--fill-2); color:var(--label-2); }
.pill.good{ background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); }

/* buttons (content layer: filled / tinted / plain, no glass) */
.btn{
  border:none; min-height:50px; padding:12px 20px; border-radius:25px; font-weight:600; font-size:var(--t-body);
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center;
  background:var(--fill-2); color:var(--accent); transition:transform .35s var(--spring-bounce), opacity .2s;
}
.btn:active{ transform:scale(.96); }
.btn.filled{ background:var(--accent); color:var(--on-accent); }
.btn.plain{ background:transparent; }
.btn.danger{ color:var(--red); }
.btn.small{ min-height:44px; padding:8px 16px; font-size:var(--t-sub); border-radius:22px; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:default; transform:none; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn-row > .btn{ flex:1 1 160px; }

/* today hero (content) */
.today{ background:var(--bg-2); border-radius:var(--r-card); padding:20px; display:flex; flex-direction:column; gap:18px; }
.today-top{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.ring{ width:5.4rem; height:5.4rem; flex:none; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .track{ stroke:var(--fill); }
.ring .val{ stroke:var(--accent); transition:stroke-dashoffset .8s var(--spring); }
.ring .lbl{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
.ring .lbl b{ font-size:var(--t-title2); font-family:var(--font-display); line-height:1; }
.ring .lbl small{ font-size:var(--t-cap2); color:var(--label-2); }
.today-facts{ flex:1; min-width:12rem; display:flex; flex-direction:column; gap:6px; }
.today-facts .big{ font-family:var(--font-display); font-size:var(--t-title2); font-weight:700; margin:0; }
.today-facts p{ margin:0; color:var(--label-2); font-size:var(--t-sub); }
.fact-line{ display:flex; align-items:center; gap:6px; color:var(--label-2); font-size:var(--t-sub); }
.fact-line svg.i{ color:var(--orange); }

/* deck header stats */
.stage-bars{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; align-items:end; height:64px; }
.stage-bars .b{ display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.stage-bars .b i{ display:block; width:100%; max-width:42px; border-radius:6px 6px 3px 3px; background:var(--accent); min-height:3px; }
.stage-bars .b span{ font-size:var(--t-cap2); color:var(--label-2); font-variant-numeric:tabular-nums; }
.stats-card{ background:var(--bg-2); border-radius:var(--r-card); padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(8.5rem,1fr)); gap:12px; }
.stat{ background:var(--bg-2); border-radius:var(--r-group); padding:14px 16px; display:flex; flex-direction:column; gap:2px; }
.stat b{ font-family:var(--font-display); font-size:var(--t-title1); font-weight:700; font-variant-numeric:tabular-nums; }
.stat span{ color:var(--label-2); font-size:var(--t-sub); }
.progress{ height:8px; border-radius:4px; background:var(--fill); overflow:hidden; }
.progress > i{ display:block; height:100%; background:var(--green); border-radius:4px; transition:width .6s var(--spring); }
.progress-line{ display:flex; justify-content:space-between; gap:8px; color:var(--label-2); font-size:var(--t-sub); flex-wrap:wrap; }

/* week chart */
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:150px; }
.week .d{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
.week .d i{ display:block; width:100%; max-width:34px; border-radius:7px 7px 3px 3px; background:var(--fill); min-height:4px; }
.week .d.has i{ background:var(--accent); }
.week .d.today span{ color:var(--label); font-weight:700; }
.week .d span{ font-size:var(--t-cap); color:var(--label-2); }
.week .d em{ font-style:normal; font-size:var(--t-cap2); color:var(--label-2); font-variant-numeric:tabular-nums; min-height:1em; }

/* swipe rows */
.swipe{ position:relative; overflow:hidden; background:var(--bg-2); }
.swipe.dragging, .swipe.open{ background:var(--red); }
.swipe .row{ transition:transform .4s var(--spring); touch-action:pan-y; z-index:1; }
.swipe.dragging .row{ transition:none; }
.swipe-actions{ position:absolute; inset:0 0 0 auto; display:flex; z-index:0; }
.swipe-actions button{ border:none; color:#fff; min-width:84px; font-weight:600; font-size:var(--t-sub); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
.swipe-actions .edit{ background:var(--c-gray); }
.swipe-actions .del{ background:var(--red); }
.card-thumb{ width:2.8rem; height:2.8rem; border-radius:10px; overflow:hidden; flex:none; background:var(--fill-2); }
.card-thumb img, .card-thumb svg{ width:100%; height:100%; object-fit:cover; display:block; }
.known-mark{ color:var(--green); display:inline-flex; align-items:center; gap:3px; font-size:var(--t-foot); font-weight:600; }
.stage-tag{ font-size:var(--t-foot); color:var(--label-2); }

.empty{ text-align:center; padding:36px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; background:var(--bg-2); border-radius:var(--r-card); }
.empty .glyph{ width:3.6rem; height:3.6rem; color:var(--label-3); }
.empty h3{ margin:0; font-size:var(--t-title3); font-family:var(--font-display); }
.empty p{ margin:0; color:var(--label-2); max-width:30rem; line-height:1.45; }
.banner{ background:var(--accent-soft); color:var(--label); border-radius:var(--r-group); padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:var(--t-sub); line-height:1.4; }
.banner svg.i{ color:var(--accent); margin-top:1px; }
.loading{ display:flex; align-items:center; gap:10px; color:var(--label-2); padding:6px 4px; font-size:var(--t-sub); }
.spinner{ width:1.1rem; height:1.1rem; border-radius:50%; border:2.5px solid var(--fill); border-top-color:var(--label-2); animation:spin .8s linear infinite; flex:none; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- learn (full-screen cover) ---------- */
.learn{
  position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 12px) var(--gutter-l);
  transform:translateY(100%); transition:transform .55s var(--spring); overflow:hidden;
}
.learn.open{ transform:none; }
.learn-top{ display:flex; align-items:center; gap:10px; max-width:760px; width:100%; margin:0 auto; }
.learn-top .mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; align-items:center; }
.learn-top .mid b{ font-size:var(--t-sub); font-weight:600; font-variant-numeric:tabular-nums; }
.learn-top .mid small{ font-size:var(--t-foot); color:var(--label-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.learn-top .progress{ width:100%; height:4px; }
.learn-top .progress > i{ background:var(--accent); }
.learn-stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:14px 0; perspective:1600px; min-height:0; }
.flip{
  position:relative; width:100%; max-width:640px; display:grid; transform-style:preserve-3d;
  transition:transform .6s var(--spring); touch-action:pan-y; cursor:pointer; max-height:100%;
}
.flip.flipped{ transform:rotateY(180deg); }
.flip.dragging{ transition:none; }
.flip-wrap{ position:relative; width:100%; max-width:640px; transition:transform .45s var(--spring), opacity .3s ease; max-height:100%; display:flex; }
.flip-wrap.dragging{ transition:none; }
.face{
  grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--bg-2); border-radius:var(--r-card); padding:24px; min-height:min(56vh, 26rem);
  display:flex; flex-direction:column; gap:14px; overflow:auto; max-height:calc(100vh - 260px);
  box-shadow:0 1px 2px rgba(0,0,0,.05), 0 12px 40px rgba(0,0,0,.08);
}
.face.back{ transform:rotateY(180deg); }
.face .eyebrow{ font-size:var(--t-foot); font-weight:600; color:var(--label-2); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.face .eyebrow .dot{ width:.6rem; height:.6rem; border-radius:50%; }
.face .text{ flex:1; display:flex; align-items:center; font-family:var(--font-serif); font-size:var(--t-title2); line-height:1.4; overflow-wrap:anywhere; white-space:pre-wrap; }
.face .hint{ text-align:center; color:var(--label-2); font-size:var(--t-foot); }
.face .media{ border-radius:16px; overflow:hidden; background:var(--fill-2); display:flex; align-items:center; justify-content:center; max-height:32vh; }
.face .media img{ max-width:100%; max-height:32vh; object-fit:contain; display:block; }
.face .media svg{ width:100%; height:auto; max-height:32vh; display:block; }
.explain{ background:var(--fill-2); border-radius:16px; padding:12px 14px; font-size:var(--t-callout); line-height:1.45; color:var(--label); white-space:pre-wrap; }
.swipe-label{ position:absolute; top:18px; z-index:5; font-weight:700; font-size:var(--t-sub); padding:6px 12px; border-radius:99px; opacity:0; display:flex; gap:6px; align-items:center; pointer-events:none; background:var(--bg-2); box-shadow:0 2px 10px rgba(0,0,0,.12); }
.swipe-label.known{ right:18px; color:var(--green); }
.swipe-label.again{ left:18px; color:var(--orange); }
.learn-bottom{ display:flex; justify-content:center; }
.answer-bar{ display:flex; gap:6px; padding:6px; border-radius:36px; width:100%; max-width:520px; }
.answer-bar .btn{ flex:1; min-height:56px; border-radius:30px; }
.answer-bar .btn.again{ background:transparent; color:var(--label); }
.answer-bar .btn.reveal{ background:var(--accent); color:var(--on-accent); }
.kbd-hint{ text-align:center; color:var(--label-2); font-size:var(--t-cap); margin-top:8px; }
@media (hover:none){ .kbd-hint{ display:none; } }
.done{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; max-width:460px; margin:0 auto; width:100%; }
.done .seal{ width:5rem; height:5rem; border-radius:50%; background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); display:flex; align-items:center; justify-content:center; }
.done .seal svg.i{ width:2.6rem; height:2.6rem; stroke-width:2.4; }
.done h2{ margin:0; font-family:var(--font-display); font-size:var(--t-title1); }
.done p{ margin:0; color:var(--label-2); }
.done .stat-grid{ width:100%; }
.done .stat{ background:var(--bg-2); }
.done .btn{ width:100%; }

/* ---------- sheets, menus, toasts (function layer) ---------- */
.scrim{ position:fixed; inset:0; z-index:80; background:var(--dim); opacity:0; transition:opacity .35s ease; }
.scrim.show{ opacity:1; }
.sheet{
  position:fixed; z-index:81; left:max(8px, env(safe-area-inset-left, 0px)); right:max(8px, env(safe-area-inset-right, 0px));
  bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); max-height:calc(100vh - env(safe-area-inset-top, 0px) - 24px);

.sheet.glass{ background:var(--glass-fill-strong); }
.sheet.show{ transform:none; }

  .sheet.show{ transform:translate(-50%,-50%); opacity:1; }
}
.sheet-head{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; padding:12px 12px 8px; }
.sheet-head h2{ margin:0; font-size:var(--t-body); font-weight:600; text-align:center; }
.sheet-head .l{ justify-self:start; } .sheet-head .r{ justify-self:end; }
.sheet-head .hbtn{ border:none; background:var(--fill-2); color:var(--label); min-height:44px; min-width:44px; padding:0 14px; border-radius:22px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; }
.sheet-head .hbtn.primary{ background:var(--accent); color:var(--on-accent); font-weight:600; }
.sheet-head .hbtn:disabled{ opacity:.4; }
.sheet-body{ overflow:auto; padding:8px 16px 20px; display:flex; flex-direction:column; gap:20px; overscroll-behavior:contain; }
.sheet .group{ border-radius:18px; }   /* concentric: 34 sheet − 16 inset */
.field{ display:block; width:100%; border:none; background:var(--bg-2); padding:14px 16px; outline:none; font-size:var(--t-body); resize:vertical; min-height:52px; line-height:1.4; }
.field::placeholder{ color:var(--label-3); }
textarea.field{ min-height:6.5rem; }
.group .field + .field{ border-top:.5px solid var(--separator); }
.field-label{ font-size:var(--t-foot); color:var(--label-2); padding:0 16px 6px; display:block; }
.swatches{ display:flex; flex-wrap:wrap; gap:10px; padding:14px 16px; background:var(--bg-2); }
.swatch{ width:44px; height:44px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1); }
.swatch[aria-checked="true"]{ outline:3px solid var(--label); outline-offset:3px; }

.seg button{ flex:1; border:none; background:transparent; min-height:38px; border-radius:10px; font-size:var(--t-sub); font-weight:500; color:var(--label); padding:4px 8px; }
.seg button[aria-checked="true"]{ background:var(--bg-2); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.12); }
.toggle{ position:relative; width:52px; height:32px; flex:none; }
.toggle input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }

.stepper button{ border:none; background:transparent; width:46px; height:36px; font-size:1.2rem; color:var(--label); }
.stepper button + button{ border-left:.5px solid var(--separator); }

.photo{ position:relative; width:84px; height:84px; border-radius:16px; overflow:hidden; background:var(--fill-2); }
.photo img{ width:100%; height:100%; object-fit:cover; }
.photo.primary{ outline:3px solid var(--accent); outline-offset:2px; }
.photo .x{ position:absolute; top:4px; right:4px; width:28px; height:28px; border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; }
.photo .x svg.i{ width:.9rem; height:.9rem; stroke-width:2.6; }
.photo .star{ position:absolute; left:4px; bottom:4px; border:none; border-radius:99px; background:rgba(0,0,0,.55); color:#fff; font-size:var(--t-cap2); font-weight:600; padding:4px 8px; min-height:28px; }
.photo-add{ width:84px; height:84px; border-radius:16px; border:1.5px dashed var(--label-3); color:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:var(--t-cap); font-weight:600; cursor:pointer; }
.photo-add svg.i{ width:1.5rem; height:1.5rem; }
.draft{ position:relative; }
.draft .field{ padding-right:56px; }
.draft .rm{ position:absolute; top:6px; right:6px; z-index:2; width:44px; height:44px; border:none; border-radius:22px; background:transparent; color:var(--label-2); display:flex; align-items:center; justify-content:center; }
.draft-media{ background:var(--bg-2); padding:10px 16px 14px; border-top:.5px solid var(--separator); display:flex; flex-direction:column; gap:8px; }
.draft-media .box{ border-radius:12px; overflow:hidden; max-height:180px; display:flex; justify-content:center; background:var(--fill-2); }
.draft-media .box svg, .draft-media .box img{ max-height:180px; width:100%; display:block; object-fit:contain; }
.status{ font-size:var(--t-sub); color:var(--label-2); min-height:1.2em; margin:0; line-height:1.4; }
.status.err{ color:var(--red); }
.menu{
  position:fixed; z-index:90; min-width:240px; max-width:min(320px, calc(100vw - 24px)); border-radius:22px; padding:6px;
  display:flex; flex-direction:column; transform:scale(.4); opacity:0; transition:transform .4s var(--spring), opacity .2s ease;
}
.menu.glass{ background:var(--glass-fill-strong); }
.menu.show{ transform:none; opacity:1; }
.menu button{ border:none; background:transparent; display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:44px; padding:10px 14px; border-radius:16px; font-size:var(--t-body); text-align:left; color:var(--label); }

.toast{
  position:fixed; z-index:95; left:50%; top:calc(env(safe-area-inset-top, 0px) + 10px);
  transform:translate(-50%, -140%); transition:transform .5s var(--spring);

  .learn.open{ opacity:1; }
  .sheet, .menu{ transition:opacity .25s ease !important; }
  .sheet{ transform:none; opacity:0; } .sheet.show{ opacity:1; }
  @media (min-width:700px){ .sheet{ transform:translate(-50%,-50%); } }
  .menu{ transform:none; }
  .flip{ transform-style:flat; }
  .flip.flipped{ transform:none; }

  .flip.flipped .face.front{ opacity:0; }
  .face.front{ transition:opacity .25s ease !important; }
}

  var Local = (function(){
    var DB_NAME = "karteikasten", STORE = "kv", dbp = null;
    function open(){
      if (dbp) return dbp;
      dbp = new Promise(function(resolve, reject){
        if (!window.indexedDB) return reject(new Error("no idb"));
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(){ req.result.createObjectStore(STORE); };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
      return dbp;
    }
    function get(key){
      return open().then(function(db){ return new Promise(function(res, rej){
        var r = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
        r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
      }); }).catch(function(){
        try { var v = localStorage.getItem(DB_NAME + "." + key); return v ? JSON.parse(v) : undefined; } catch (e) { return undefined; }
      });
    }
    function set(key, val){
      return open().then(function(db){ return new Promise(function(res, rej){
        var tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).put(val, key);
        tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
      }); }).catch(function(){
        try { localStorage.setItem(DB_NAME + "." + key, JSON.stringify(val)); } catch (e) { toast("Speichern fehlgeschlagen – der Gerätespeicher ist voll."); }
      });
    }
    return { get: get, set: set };
  })();

    if (S.storage !== "cloud" || !S.db) return Promise.resolve();
    var body = {};
    (fields || ["cards"]).forEach(function(f){ body[f] = clone(deck[f]); });
    pendingWrites[deck.id] = (pendingWrites[deck.id] || 0) + 1;
    var prev = writeChains[deck.id] || Promise.resolve();
    var next = prev.catch(function(){}).then(function(){
      return S.db.doc("decks/" + deck.id).update(body);
    }).catch(function(err){
      console.error("Speichern fehlgeschlagen", err);
      toast("Änderung konnte nicht gesichert werden. Prüfe deine Verbindung.");
    }).then(function(){ pendingWrites[deck.id]--; });
    writeChains[deck.id] = next;

            // While our own writes for this deck are in flight, keep the local
            // cards: an older echo must not overwrite newer answers.
            if (existing && pendingWrites[doc.id] > 0) return existing;
            var cards = [];
            if (Array.isArray(data.cards)){ try { cards = JSON.parse(JSON.stringify(data.cards)); } catch (e) { cards = []; } }

  function fileToJpeg(file, maxSide, quality){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality || .82));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject({ code: "image_rejected" }); };
      img.src = url;
    });
  }
  function parseJsonLoose(text){
    text = String(text || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
    try { return JSON.parse(text); } catch (e) {}
    var s = text.indexOf("["), e2 = text.lastIndexOf("]");
    if (s > -1 && e2 > s){ try { return JSON.parse(text.slice(s, e2 + 1)); } catch (e3) {} }
    throw { code: "invalid_json" };
  }
  function anthropicCall(prompt, images, maxTokens){
    var imgs = images || [];
    return Promise.all(imgs.map(function(f){ return fileToJpeg(f, 1568, .85); })).then(function(urls){
      var content = urls.map(function(u){ return { type:"image", source:{ type:"base64", media_type:"image/jpeg", data:u.split(",")[1] } }; });
      content.push({ type:"text", text: prompt });
      return fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "content-type":"application/json", "x-api-key": settings.apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({ model:"claude-sonnet-5-5", max_tokens: maxTokens || 4096, messages:[{ role:"user", content: content }] })
      });
    }).then(function(r){
      if (!r.ok) throw { code: r.status === 401 ? "bad_key" : r.status === 429 ? "rate_limited" : r.status === 413 ? "prompt_too_large" : "http" };
      return r.json();
    }, function(err){ throw (err && err.code) ? err : { code: "offline" }; }).then(function(j){
      return (j.content || []).map(function(c){ return c.text || ""; }).join("");
    });
  }
  function aiJson(prompt, images){
    if (S.sampler){
      var opts = { modelTier: "default" };
      if (images && images.length) opts.images = images;
      return S.sampler.json(prompt, opts);
    }
    return anthropicCall(prompt, images).then(parseJsonLoose);
  }
  function aiText(prompt){
    if (S.sampler) return S.sampler(prompt, { modelTier: "quick" }).then(function(r){ return r.text; });
    return anthropicCall(prompt, null, 600);
  }
  function aiErrorMessage(code){
    switch(code){
      case "not_granted": return "Du hast den Zugriff auf Claude nicht erlaubt. Erlaube ihn, um Karten erstellen zu lassen.";
      case "rate_limited": return "Gerade zu viele Anfragen. Versuch es in einer Minute noch einmal.";
      case "prompt_too_large": return "Der Text ist zu lang. Kürze ihn etwas und versuch es erneut.";
      case "invalid_json": return "Die Antwort war unvollständig. Versuch es noch einmal.";
      case "cancelled": return "Abgebrochen.";
      case "sampling_disabled": return "KI-Funktionen sind für dieses Konto nicht verfügbar.";
      case "images_unavailable": return "Fotos werden in dieser Ansicht nicht unterstützt.";
      case "image_rejected": return "Das Foto konnte nicht gelesen werden. Versuch ein anderes Bild.";
      case "empty_completion": return "Es wurde nichts erkannt. Versuch ein schärferes Foto mit mehr Licht.";
      case "refused": return "Die Analyse wurde abgelehnt. Versuch es mit einem anderen Ausschnitt.";
      case "bad_key": return "Der API-Schlüssel stimmt nicht. Prüfe ihn in den Einstellungen.";
      case "offline": return "Keine Verbindung. Prüfe dein Internet und versuch es erneut.";
      default: return "Das hat nicht geklappt. Versuch es erneut.";
    }
  }
  function cleanDraftArray(result){
    var arr = Array.isArray(result) ? result : (result && Array.isArray(result.cards) ? result.cards : null);
    if (!arr) return [];
    return arr.map(function(item){
      var out = { q: String(item && item.q || "").trim().slice(0, 300), a: String(item && item.a || "").trim().slice(0, 500) };
      var safe = sanitizeSvg(item && item.svg);
      if (safe) out.svg = safe;
      return out;
    }).filter(function(c){ return c.q && c.a; });
  }

  // ======================================================================
  // Rendering: shell
  // ======================================================================
  function isWide(){ return window.matchMedia("(min-width: 900px)").matches; }

  function renderShell(){
    renderSidebar();
    renderTabbar();
    renderView();
  }

  function renderSidebar(){
    var sb = $("sidebar");
    var tabs = [["home","stack","Heute"],["stats","chart","Statistik"],["settings","gear","Einstellungen"]];
    var html = '<label class="side-search">' + icon("search") + '<span class="sr">Karten durchsuchen</span>' +
      '<input id="sideSearch" type="search" placeholder="Suchen" value="' + esc(S.query) + '" autocomplete="off"></label>';
    html += '<div class="side-section">' + tabs.map(function(t){
      var cur = S.tab === t[0] && !(t[0] === "home" && S.deckId);
      var extra = t[0] === "home" && S.loaded ? '<span class="count">' + totals().due + '</span>' : "";
      return '<button class="side-item" data-action="tab" data-tab="' + t[0] + '" aria-current="' + cur + '">' + icon(t[1]) + '<span class="txt">' + t[2] + '</span>' + extra + '</button>';
    }).join("") + '</div>';
    html += '<div class="side-section"><div class="side-head">Fächer</div>';
    if (!S.loaded){
      html += '<div class="loading"><span class="spinner"></span>Lädt …</div>';
    } else {
      html += S.decks.map(function(d){
        var cur = S.tab === "home" && S.deckId === d.id;
        return '<button class="side-item" data-action="open-deck" data-deck="' + d.id + '" aria-current="' + cur + '">' +
          '<span class="deck-icon sq" style="background:' + deckColor(d) + ';width:1.7rem;height:1.7rem;border-radius:7px">' + icon("stack") + '</span>' +
          '<span class="txt">' + esc(d.name) + '</span><span class="count">' + d.cards.length + '</span></button>';
      }).join("");
      html += '<button class="side-item" data-action="new-deck" style="color:var(--accent)">' + icon("plus") + '<span class="txt">Neues Fach</span></button>';
    }
    html += '</div>';
    var hadFocus = document.activeElement && document.activeElement.id === "sideSearch";
    sb.innerHTML = html;
    if (hadFocus){ var inp = $("sideSearch"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

  function renderTabbar(){
    var wrap = $("tabbarWrap");
    if (S.tab === "search"){
      if ($("tabSearch")) return; // keep the field (and the keyboard) alive
      wrap.innerHTML =
        '<label class="searchbar glass">' + icon("search") + '<span class="sr">Karten durchsuchen</span>' +
          '<input id="tabSearch" type="search" placeholder="Fragen und Antworten durchsuchen" value="' + esc(S.query) + '" autocomplete="off" enterkeyhint="search"></label>' +
        '<button class="search-orb glass" data-action="tab" data-tab="home" aria-label="Suche schließen">' + icon("xmark") + '</button>';
      return;
    }
    var tabs = [["home","stack","Heute"],["stats","chart","Statistik"],["settings","gear","Einstellungen"]];
    wrap.innerHTML =
      '<div class="tabbar glass" role="tablist" aria-label="Bereiche">' + tabs.map(function(t){
        return '<button class="tab" role="tab" data-action="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + icon(t[1]) + '<span>' + t[2] + '</span></button>';
      }).join("") + '</div>' +
      '<button class="search-orb glass" data-action="tab" data-tab="search" aria-label="Suchen" aria-selected="false">' + icon("search") + '</button>';
  }

  function setNav(title, lead, trail){
    $("navTitle").textContent = title || "";
    $("navLead").innerHTML = lead || "";
    $("navTrail").innerHTML = trail || "";
  }

  function renderView(){
    var v = $("view");
    if (S.tab === "home" && S.deckId && getDeck(S.deckId)) return renderDeck(v, getDeck(S.deckId));
    if (S.tab === "home") return renderHome(v);
    if (S.tab === "stats") return renderStats(v);
    if (S.tab === "search") return renderSearch(v);
    if (S.tab === "settings") return renderSettings(v);
  }

  // ---------- Home ----------
  function ringHtml(value, goal){
    var r = 42, circ = 2 * Math.PI * r, pct = Math.min(1, goal ? value / goal : 0);
    return '<div class="ring" role="img" aria-label="Tagesziel: ' + value + ' von ' + goal + ' Karten">' +
      '<svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="' + r + '" fill="none" stroke-width="11"/>' +
      '<circle class="val" cx="50" cy="50" r="' + r + '" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ * (1 - pct)).toFixed(1) + '"/></svg>' +
      '<div class="lbl" aria-hidden="true"><b>' + value + '</b><small>von ' + goal + '</small></div></div>';
  }

  function renderHome(v){
    setNav("Karteikasten", "", '<button class="gbtn glass accent" data-action="new-deck" aria-label="Neues Fach anlegen">' + icon("plus") + '</button>');
    var html = '<div class="title-block"><h1 class="large-title">Karteikasten</h1><p class="subtitle">' + storageLabel() + '</p></div>';

    if (!S.loaded){
      v.innerHTML = html + '<div class="empty">' + icon("stack", "glyph") + '<h3>Deine Fächer werden geladen</h3><p>Gleich siehst du hier deine Karteikarten und was heute dran ist.</p><div class="loading"><span class="spinner"></span>Einen Moment …</div></div>';
      return;
    }
    if (!S.decks.length){
      v.innerHTML = html +
        '<div class="empty">' + icon("stack", "glyph") +
          '<h3>Noch keine Fächer</h3>' +
          '<p>Lege ein Fach an, zum Beispiel „Rechnungswesen“, und füge Karten hinzu – selbst geschrieben, aus einem Text oder aus einem Foto deiner Notizen.</p>' +
          '<div class="btn-row" style="width:100%;max-width:420px"><button class="btn filled" data-action="new-deck">' + icon("plus") + 'Fach anlegen</button>' +
          '<button class="btn" data-action="add-example">Beispiel laden</button></div>' +
        '</div>';
      return;
    }
    var t = totals(), done = dayCount(today()), st = streak();
    html += '<section class="today sq" aria-label="Heute">' +
      '<div class="today-top">' + ringHtml(done, settings.goal) +
        '<div class="today-facts"><p class="big">' + (t.due ? plural(t.due, "Karte", "Karten") + " fällig" : "Alles erledigt") + '</p>' +
        '<p>' + (t.due ? "Wiederhole jetzt, was heute dran ist." : "Für heute ist nichts mehr fällig. Du kannst trotzdem üben.") + '</p>' +
        (st ? '<span class="fact-line">' + icon("flame") + plural(st, "Tag", "Tage") + ' in Folge gelernt</span>' : '') +
        '</div></div>' +
      (t.due ? '<button class="btn filled block" data-action="learn-all-due">' + icon("play") + 'Fällige lernen</button>'
             : '<button class="btn block" data-action="learn-all">' + icon("shuffle") + 'Alles gemischt üben</button>') +
    '</section>';

    html += '<section class="section"><div class="section-head"><h2>Fächer</h2><span class="meta">' + plural(t.total, "Karte", "Karten") + '</span></div><div class="group sq">';
    html += S.decks.map(function(d){
      var s = deckStats(d), pct = s.total ? Math.round(s.mastered / s.total * 100) : 0;
      return '<button class="row deck-row" data-action="open-deck" data-deck="' + d.id + '">' +
        '<span class="deck-icon sq" style="background:' + deckColor(d) + '">' + icon("stack") + '</span>' +
        '<span class="grow"><span class="t strong">' + esc(d.name) + '</span>' +
        '<span class="s">' + plural(s.total, "Karte", "Karten") + ' · ' + pct + ' % gewusst</span>' +
        (s.total ? '<span class="mini-progress" aria-hidden="true"><i style="width:' + pct + '%"></i></span>' : '') + '</span>' +
        '<span class="trail">' + (s.due ? '<span class="pill">' + s.due + ' fällig</span>' : '') + icon("chevR", "chev") + '</span></button>';
    }).join("");
    html += '<button class="row accent-row" data-action="new-deck" style="--sep-inset:16px">' + icon("plus") + '<span class="grow"><span class="t">Neues Fach</span></span></button>';
    html += '</div></section>';
    v.innerHTML = html;
  }

  function storageLabel(){
    if (S.storage === "cloud") return "In Claude gesichert";
    if (S.storage === "local") return "Auf diesem Gerät gesichert";
    if (S.storage === "memory") return "Nicht gesichert";
    return "Lädt …";
  }

  // ---------- Deck ----------
  function renderDeck(v, d){
    var back = '<button class="gbtn glass only-narrow" data-action="back" aria-label="Zurück zu Heute">' + icon("chevL") + '</button>';
    var trail = '<div class="ggroup glass">' +
      '<button class="gbtn accent" data-action="add-menu" aria-label="Karten hinzufügen" aria-haspopup="menu">' + icon("plus") + '</button>' +
      '<button class="gbtn" data-action="deck-menu" aria-label="Weitere Aktionen" aria-haspopup="menu">' + icon("ellipsis") + '</button></div>';
    setNav(d.name, back, trail);
    var s = deckStats(d), pct = s.total ? Math.round(s.mastered / s.total * 100) : 0;
    var html = '<div class="title-block"><h1 class="large-title">' + esc(d.name) + '</h1><p class="subtitle">' + plural(s.total, "Karte", "Karten") + (s.due ? ' · ' + s.due + ' heute fällig' : '') + '</p></div>';

    if (!s.total){
      html += '<div class="empty">' + icon("doc", "glyph") + '<h3>Noch keine Karten</h3>' +
        '<p>Schreib Karten selbst oder lass sie aus einem Text oder einem Foto deiner Notizen erstellen.</p>' +
        '<div class="btn-row" style="width:100%;max-width:520px">' +
          '<button class="btn filled" data-action="new-card">' + icon("pencil") + 'Karte schreiben</button>' +
          '<button class="btn" data-action="gen" data-mode="text">' + icon("sparkles") + 'Aus Text</button>' +
          '<button class="btn" data-action="gen" data-mode="photo">' + icon("camera") + 'Aus Foto</button>' +
        '</div></div>';
      v.innerHTML = html;
      return;
    }

    html += '<section class="stats-card sq" aria-label="Fortschritt">' +
      '<div class="progress-line"><span><b style="color:var(--label)">' + s.mastered + '</b> von ' + s.total + ' gewusst</span><span>' + pct + ' %</span></div>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="Gewusst"><i style="width:' + pct + '%"></i></div>' +
      '<div class="btn-row">' +
        (s.due ? '<button class="btn filled" data-action="learn-deck" data-deck="' + d.id + '" data-which="due">' + icon("play") + 'Lernen · ' + s.due + '</button>'
               : '<button class="btn filled" data-action="learn-deck" data-deck="' + d.id + '" data-which="all">' + icon("play") + 'Alle üben</button>') +
        (s.total - s.mastered > 0 && s.due !== s.total - s.mastered ? '<button class="btn" data-action="learn-deck" data-deck="' + d.id + '" data-which="unknown">' + icon("repeat") + 'Nicht gewusste · ' + (s.total - s.mastered) + '</button>' : '') +
        (s.due ? '<button class="btn" data-action="learn-deck" data-deck="' + d.id + '" data-which="all">' + icon("shuffle") + 'Alle üben</button>' : '') +
      '</div></section>';

    html += '<section class="section"><div class="section-head"><h2>Karten</h2><span class="meta">Zum Bearbeiten tippen, zum Löschen nach links wischen</span></div><div class="group sq" id="cardList">';
    html += d.cards.map(function(c){ return cardRowHtml(d, c); }).join("");
    html += '</div></section>';
    v.innerHTML = html;
  }

  function mediaThumb(m){
    if (!m) return "";
    if (m.kind === "photo" && safeUrl(m.url)) return '<span class="card-thumb"><img src="' + esc(safeUrl(m.url)) + '" alt="" loading="lazy"></span>';
    if (m.kind === "svg"){ var s = sanitizeSvg(m.markup); return s ? '<span class="card-thumb">' + s + '</span>' : ""; }
    return "";
  }
  function cardRowHtml(d, c, showDeck){
    return '<div class="swipe" data-deck="' + d.id + '" data-card="' + c.id + '">' +
      '<div class="swipe-actions" aria-hidden="true"><button class="edit" tabindex="-1" data-action="edit-card" data-deck="' + d.id + '" data-card="' + c.id + '">' + icon("pencil") + 'Bearbeiten</button>' +
      '<button class="del" tabindex="-1" data-action="delete-card" data-deck="' + d.id + '" data-card="' + c.id + '">' + icon("trash") + 'Löschen</button></div>' +
      '<button class="row" data-action="edit-card" data-deck="' + d.id + '" data-card="' + c.id + '" aria-label="Karte bearbeiten: ' + esc(c.q) + '">' +
        mediaThumb(c.media) +
        '<span class="grow"><span class="t strong">' + esc(c.q) + '</span><span class="s clamp">' + esc(c.a) + '</span>' +
        '<span class="s" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:2px">' +
          (showDeck ? '<span>' + esc(d.name) + '</span>' : '') +
          (c.mastered ? '<span class="known-mark">' + icon("checkCircle") + 'Gewusst</span>' : '') +
          '<span class="stage-tag">Stufe ' + c.box + (isDue(c) ? ' · fällig' : ' · ab ' + fmtDate(c.due)) + '</span>' +
        '</span></span>' +
      '</button></div>';
  }
  function fmtDate(str){
    var t = today();
    if (str === addDays(t, 1)) return "morgen";
    var p = str.split("-");
    return +p[2] + "." + +p[1] + ".";
  }

  // ---------- Stats ----------
  function renderStats(v){
    setNav("Statistik", "", "");
    var html = '<div class="title-block"><h1 class="large-title">Statistik</h1><p class="subtitle">So läuft dein Lernen</p></div>';
    if (!S.loaded){ v.innerHTML = html + '<div class="loading"><span class="spinner"></span>Lädt …</div>'; return; }
    var t = totals(), d = today(), st = streak();
    var week = 0;
    for (var i = 0; i < 7; i++) week += dayCount(addDays(d, -i));
    html += '<div class="stat-grid">' +
      '<div class="stat sq"><b>' + dayCount(d) + '</b><span>heute wiederholt</span></div>' +
      '<div class="stat sq"><b>' + st + '</b><span>' + (st === 1 ? "Tag" : "Tage") + ' in Folge</span></div>' +
      '<div class="stat sq"><b>' + week + '</b><span>in 7 Tagen</span></div>' +
      '<div class="stat sq"><b>' + (t.total ? Math.round(t.mastered / t.total * 100) : 0) + ' %</b><span>gewusst</span></div>' +
    '</div>';

    // last 7 days
    var days = [], max = 1, names = ["So","Mo","Di","Mi","Do","Fr","Sa"];
    for (var j = 6; j >= 0; j--){ var ds = addDays(d, -j); var n = dayCount(ds); max = Math.max(max, n); days.push({ ds: ds, n: n }); }
    html += '<section class="section"><div class="section-head"><h2>Letzte 7 Tage</h2><span class="meta">Wiederholte Karten · Ziel ' + settings.goal + '/Tag</span></div>' +
      '<div class="stats-card sq"><div class="week" role="img" aria-label="' + days.map(function(x){ var p = x.ds.split("-"); return names[new Date(+p[0], +p[1]-1, +p[2]).getDay()] + " " + x.n; }).join(", ") + '">' +
      days.map(function(x){
        var p = x.ds.split("-"), wd = names[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
        return '<div class="d' + (x.n ? " has" : "") + (x.ds === d ? " today" : "") + '"><em>' + (x.n || "") + '</em><i style="height:' + Math.max(3, Math.round(x.n / max * 100)) + '%"></i><span>' + wd + '</span></div>';
      }).join("") + '</div></div></section>';

    // Leitner stages
    var smax = Math.max.apply(null, t.stages.slice(1).concat([1]));
    html += '<section class="section"><div class="section-head"><h2>Lernstufen</h2><span class="meta">Je höher, desto sicherer</span></div>' +
      '<div class="stats-card sq"><div class="stage-bars" role="img" aria-label="' + [1,2,3,4,5].map(function(k){ return "Stufe " + k + ": " + t.stages[k]; }).join(", ") + '">' +
      [1,2,3,4,5].map(function(k){
        return '<div class="b"><span>' + t.stages[k] + '</span><i style="height:' + Math.max(3, Math.round(t.stages[k] / smax * 70)) + '%;opacity:' + (0.35 + k * 0.13) + '"></i><span>' + k + '</span></div>';
      }).join("") + '</div>' +
      '<p class="section-foot" style="padding:0">Stufe 1 kommt jeden Tag dran, Stufe 2 am nächsten Tag, dann nach 3, 7 und 16 Tagen. Weißt du eine Karte, rückt sie eine Stufe auf. Sonst beginnt sie wieder bei Stufe 1.</p></div></section>';

    if (S.decks.length){
      html += '<section class="section"><div class="section-head"><h2>Nach Fach</h2></div><div class="group sq">' +
        S.decks.map(function(dk){
          var s = deckStats(dk), pct = s.total ? Math.round(s.mastered / s.total * 100) : 0;
          return '<button class="row deck-row" data-action="open-deck" data-deck="' + dk.id + '"><span class="deck-icon sq" style="background:' + deckColor(dk) + '">' + icon("stack") + '</span>' +
            '<span class="grow"><span class="t">' + esc(dk.name) + '</span><span class="mini-progress" aria-hidden="true"><i style="width:' + pct + '%"></i></span></span>' +
            '<span class="trail">' + pct + ' %' + icon("chevR", "chev") + '</span></button>';
        }).join("") + '</div></section>';
    }
    v.innerHTML = html;
  }

  // ---------- Search ----------
  function renderSearch(v){
    setNav("Suche", "", "");
    var q = S.query.trim().toLowerCase();
    var html = '<div class="title-block"><h1 class="large-title">Suche</h1></div>';
    if (isWide()){
      html += '<p class="subtitle" style="margin-top:-18px">Nutze das Suchfeld in der Seitenleiste.</p>';
    }
    if (!q){
      html += '<div class="empty">' + icon("search", "glyph") + '<h3>Karten durchsuchen</h3><p>Finde Fragen und Antworten aus allen Fächern.</p></div>';
      v.innerHTML = html; return;
    }
    var hits = [];
    S.decks.forEach(function(d){ d.cards.forEach(function(c){
      if ((c.q + " " + c.a).toLowerCase().indexOf(q) > -1) hits.push({ d: d, c: c });
    }); });
    if (!hits.length){
      html += '<div class="empty">' + icon("search", "glyph") + '<h3>Keine Treffer für „' + esc(S.query.trim()) + '“</h3><p>Prüfe die Schreibweise oder versuch ein anderes Stichwort.</p></div>';
    } else {
      html += '<section class="section"><div class="section-head"><h2>' + plural(hits.length, "Treffer", "Treffer") + '</h2></div><div class="group sq">' +
        hits.slice(0, 200).map(function(h){ return cardRowHtml(h.d, h.c, true); }).join("") + '</div></section>';
    }
    v.innerHTML = html;
  }

  // ---------- Settings ----------
  function segHtml(name, options, value){
    return '<div class="seg" role="radiogroup" aria-label="' + esc(name) + '">' + options.map(function(o){
      return '<button role="radio" aria-checked="' + (o[0] === value) + '" data-action="set" data-key="' + name + '" data-value="' + o[0] + '">' + o[1] + '</button>';
    }).join("") + '</div>';
  }
  function renderSettings(v){
    setNav("Einstellungen", "", "");
    var html = '<div class="title-block"><h1 class="large-title">Einstellungen</h1></div>';

    html += '<section class="section"><div class="section-head"><h2>Lernen</h2></div><div class="group sq">' +
      '<div class="row"><span class="grow"><span class="t">Tagesziel</span><span class="s">' + settings.goal + ' Karten pro Tag</span></span>' +
        '<div class="stepper"><button data-action="goal" data-delta="-5" aria-label="Tagesziel verringern">−</button><button data-action="goal" data-delta="5" aria-label="Tagesziel erhöhen">+</button></div></div>' +
      '<label class="row"><span class="grow"><span class="t">Karten mischen</span><span class="s">Zufällige Reihenfolge beim Lernen</span></span>' +
        '<span class="toggle"><input type="checkbox" id="setShuffle" data-setting="shuffle"' + (settings.shuffle ? " checked" : "") + '><i></i></span></label>' +
      '<label class="row"><span class="grow"><span class="t">Umgekehrt abfragen</span><span class="s">Erst die Antwort zeigen, dann die Frage</span></span>' +
        '<span class="toggle"><input type="checkbox" id="setReverse" data-setting="reverse"' + (settings.reverse ? " checked" : "") + '><i></i></span></label>' +

  // ======================================================================
  // Learn session
  // ======================================================================
  function shuffleArr(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function startSession(items, title, trigger){
    if (!items.length){ toast("Keine Karten zum Lernen."); return; }
    if (settings.shuffle) shuffleArr(items);
    S.session = { title: title, queue: items, idx: 0, flipped: false, known: 0, again: 0, requeued: {}, history: [], explain: {}, done: false, trigger: trigger };
    var el = $("learn");
    el.hidden = false;
    renderLearn();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add("open"); }); });
    document.body.style.overflow = "hidden";
    setTimeout(function(){ var f = $("flipCard"); if (f) f.focus(); }, 60);
  }
  function closeSession(){
    var el = $("learn");
    var trig = S.session && S.session.trigger;
    el.classList.remove("open");
    S.session = null;
    document.body.style.overflow = "";
    setTimeout(function(){ if (!S.session){ el.hidden = true; el.innerHTML = ""; } }, reducedMotion ? 260 : 560);
    renderShell();
    if (trig && document.contains(trig)) trig.focus();
  }
  function sessionCard(){
    var s = S.session, it = s.queue[s.idx];
    if (!it) return null;
    var d = getDeck(it.deckId);
    return { deck: d, card: getCard(d, it.cardId) };
  }
  function cardFaceMedia(m){
    if (!m) return "";
    if (m.kind === "photo" && safeUrl(m.url)) return '<div class="media"><img src="' + esc(safeUrl(m.url)) + '" alt="' + esc(m.alt || "Notizfoto") + '"></div>';
    if (m.kind === "svg"){ var s = sanitizeSvg(m.markup); return s ? '<div class="media" role="img" aria-label="' + esc(m.alt || "Grafik") + '">' + s + '</div>' : ""; }
    return "";
  }

  function renderLearn(){
    var s = S.session, el = $("learn");
    if (!s) return;
    // skip cards deleted meanwhile
    while (s.idx < s.queue.length && !(sessionCard() && sessionCard().card)) s.queue.splice(s.idx, 1);
    if (s.idx >= s.queue.length) s.done = true;

    var total = s.queue.length, pos = Math.min(s.idx + 1, total);
    var pct = total ? Math.round((s.done ? total : s.idx) / total * 100) : 100;
    var top = '<div class="learn-top">' +
      '<button class="gbtn glass" data-action="close-learn" aria-label="Lernen beenden">' + icon("xmark") + '</button>' +
      '<div class="mid"><b>' + (s.done ? "Fertig" : pos + " von " + total) + '</b><small>' + esc(s.title) + '</small>' +
        '<div class="progress" aria-hidden="true"><i style="width:' + pct + '%"></i></div></div>' +
      '<button class="gbtn glass" data-action="undo" aria-label="Letzte Antwort rückgängig"' + (s.history.length ? "" : " disabled style=\"opacity:.4\"") + '>' + icon("undo") + '</button>' +
    '</div>';

    if (s.done){
      var hasAgain = Object.keys(s.requeued).length > 0 || s.again > 0;
      el.innerHTML = top + '<div class="done" aria-live="polite">' +
        '<div class="seal">' + icon("check") + '</div><h2>Geschafft!</h2>' +
        '<p>' + (s.again ? "Die Karten, die du noch nicht wusstest, kommen morgen wieder dran." : "Stark – du wusstest alles.") + '</p>' +
        '<div class="stat-grid"><div class="stat sq"><b style="color:var(--green)">' + s.known + '</b><span>gewusst</span></div><div class="stat sq"><b style="color:var(--orange)">' + s.again + '</b><span>nochmal</span></div></div>' +
        (hasAgain && s.againIds && Object.keys(s.againIds).length ? '<button class="btn" data-action="learn-again">' + icon("repeat") + 'Nicht gewusste wiederholen</button>' : '') +
        '<button class="btn filled" data-action="close-learn">Fertig</button></div>';
      var fin = el.querySelector(".btn.filled"); if (fin) setTimeout(function(){ fin.focus(); }, 50);
      return;
    }

    var cc = sessionCard(), d = cc.deck, c = cc.card;
    var front = settings.reverse ? c.a : c.q, back = settings.reverse ? c.q : c.a;
    var media = cardFaceMedia(c.media);
    var expl = s.explain[c.id];
    var canExplain = aiAvailable();
    el.innerHTML = top +
      '<div class="learn-stage"><div class="flip-wrap" id="flipWrap">' +
        '<span class="swipe-label known" id="lblKnown">' + icon("check") + 'Weiß ich</span>' +
        '<span class="swipe-label again" id="lblAgain">' + icon("repeat") + 'Nochmal</span>' +
        '<div class="flip' + (s.flipped ? " flipped" : "") + '" id="flipCard" tabindex="0" role="button" aria-label="' + (s.flipped ? "Antwort. Tippen, um die Frage zu zeigen" : "Frage. Tippen, um die Antwort zu zeigen") + '">' +
          '<div class="face front sq" aria-hidden="' + s.flipped + '">' +
            '<span class="eyebrow"><span class="dot" style="background:' + deckColor(d) + '"></span>' + esc(d.name) + ' · ' + (settings.reverse ? "Antwort" : "Frage") + ' · Stufe ' + c.box + '</span>' +
            media + '<div class="text">' + esc(front) + '</div><span class="hint">Tippen zum Umdrehen</span></div>' +
          '<div class="face back sq" aria-hidden="' + !s.flipped + '">' +
            '<span class="eyebrow"><span class="dot" style="background:' + deckColor(d) + '"></span>' + (settings.reverse ? "Frage" : "Antwort") + '</span>' +
            media + '<div class="text">' + esc(back) + '</div>' +
            (expl ? '<div class="explain">' + (expl.busy ? '<span class="loading" style="padding:0"><span class="spinner"></span>Claude erklärt …</span>' : esc(expl.text)) + '</div>'
                  : (canExplain ? '<button class="btn small" data-action="explain" style="align-self:center">' + icon("sparkles") + 'Erklär mir das</button>' : '')) +
          '</div>' +
        '</div></div></div>' +
      '<div class="learn-bottom"><div class="answer-bar glass">' +
        (s.flipped
          ? '<button class="btn again" data-action="answer" data-known="0">' + icon("repeat") + 'Nochmal</button><button class="btn filled" data-action="answer" data-known="1">' + icon("check") + 'Weiß ich</button>'
          : '<button class="btn reveal" data-action="flip">Antwort zeigen</button>') +
      '</div></div>' +
      '<p class="kbd-hint">Leertaste: umdrehen · ← Nochmal · → Weiß ich · ⌘Z: rückgängig</p>';
    wireCardDrag();
  }

  function flipCard(){
    var s = S.session; if (!s || s.done) return;
    s.flipped = !s.flipped;
    var f = $("flipCard");
    if (f){
      f.classList.toggle("flipped", s.flipped);
      // swap only the parts that change so the 3D flip animates
      var faces = f.querySelectorAll(".face");
      faces[0].setAttribute("aria-hidden", s.flipped); faces[1].setAttribute("aria-hidden", !s.flipped);
      f.setAttribute("aria-label", s.flipped ? "Antwort. Tippen, um die Frage zu zeigen" : "Frage. Tippen, um die Antwort zu zeigen");
      var bar = document.querySelector(".answer-bar");
      bar.innerHTML = s.flipped
        ? '<button class="btn again" data-action="answer" data-known="0">' + icon("repeat") + 'Nochmal</button><button class="btn filled" data-action="answer" data-known="1">' + icon("check") + 'Weiß ich</button>'
        : '<button class="btn reveal" data-action="flip">Antwort zeigen</button>';
    }
    haptic(5);
  }

  function answer(known, viaSwipe){
    var s = S.session; if (!s || s.done) return;
    var cc = sessionCard(); if (!cc || !cc.card) return;
    var c = cc.card, d = cc.deck;
    var entry = { deckId: d.id, cardId: c.id, prev: { box: c.box, due: c.due, mastered: c.mastered }, known: known, requeued: false };
    if (known){
      c.box = Math.min(5, c.box + 1);
      c.due = addDays(today(), INTERVALS[c.box]);
      c.mastered = true;
      s.known++;
      if (s.againIds) delete s.againIds[c.id];
    } else {
      c.box = 1; c.due = today(); c.mastered = false;
      s.again++;
      s.againIds = s.againIds || {}; s.againIds[c.id] = d.id;
      var n = s.requeued[c.id] || 0;
      if (n < 2){ s.queue.push({ deckId: d.id, cardId: c.id }); s.requeued[c.id] = n + 1; entry.requeued = true; }
    }
    s.history.push(entry);
    bumpStats(known, 1);
    saveDeck(d, ["cards"]);
    haptic(known ? 10 : [6, 40, 6]);
    var go = function(){ s.idx++; s.flipped = false; renderLearn(); var f = $("flipCard"); if (f) f.focus(); };
    var wrap = $("flipWrap");
    if (wrap && !reducedMotion){
      var dir = known ? 1 : -1;
      wrap.style.transform = "translateX(" + (dir * 120) + "%) rotate(" + (dir * 12) + "deg)";
      wrap.style.opacity = "0";
      setTimeout(go, viaSwipe ? 220 : 260);
    } else go();
  }

  function undo(){
    var s = S.session; if (!s || !s.history.length) return;
    var h = s.history.pop();
    var d = getDeck(h.deckId), c = getCard(d, h.cardId);
    if (c){ c.box = h.prev.box; c.due = h.prev.due; c.mastered = h.prev.mastered; saveDeck(d, ["cards"]); }
    if (h.requeued){
      for (var i = s.queue.length - 1; i > s.idx - 1; i--){ if (s.queue[i].cardId === h.cardId){ s.queue.splice(i, 1); break; } }
      s.requeued[h.cardId] = Math.max(0, (s.requeued[h.cardId] || 1) - 1);
    }
    if (h.known) s.known--; else s.again--;
    bumpStats(h.known, -1);
    s.done = false;
    s.idx = Math.max(0, s.idx - 1);
    s.flipped = true;
    renderLearn();
  }

  function wireCardDrag(){
    var wrap = $("flipWrap"), card = $("flipCard");
    if (!wrap || !card) return;
    var sx = 0, sy = 0, dx = 0, active = false, moved = false, pid = null;
    var lk = $("lblKnown"), la = $("lblAgain");
    card.addEventListener("pointerdown", function(e){
      if (e.button !== 0 || e.target.closest("button")) return;
      sx = e.clientX; sy = e.clientY; dx = 0; active = true; moved = false; pid = e.pointerId;
    });
    card.addEventListener("pointermove", function(e){
      if (!active || e.pointerId !== pid) return;
      var mx = e.clientX - sx, my = e.clientY - sy;
      if (!moved && Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)){
        if (!S.session.flipped){ active = false; return; } // judge only after seeing the answer
        moved = true; wrap.classList.add("dragging");
        try { card.setPointerCapture(pid); } catch (err) {}
      }
      if (!moved) return;
      dx = mx;
      wrap.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 24) + "deg)";
      var p = Math.min(1, Math.abs(dx) / 110);
      lk.style.opacity = dx > 0 ? p : 0; la.style.opacity = dx < 0 ? p : 0;
    });
    function end(){
      if (!active) return;
      active = false;
      if (!moved) return;
      wrap.classList.remove("dragging");
      lk.style.opacity = 0; la.style.opacity = 0;
      if (Math.abs(dx) > 110) answer(dx > 0, true);
      else wrap.style.transform = "";
      card.dataset.justDragged = "1";
      setTimeout(function(){ delete card.dataset.justDragged; }, 50);
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", function(){ active = false; wrap.classList.remove("dragging"); wrap.style.transform = ""; lk.style.opacity = 0; la.style.opacity = 0; });
    card.addEventListener("click", function(e){
      if (card.dataset.justDragged || e.target.closest("button")) return;
      flipCard();
    });
    card.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); flipCard(); }
    });
  }

  function explainCurrent(){
    var s = S.session; var cc = sessionCard(); if (!cc || !cc.card) return;
    var c = cc.card;
    s.explain[c.id] = { busy: true };
    renderLearn();
    var prompt = "Du bist eine geduldige Lernhilfe für Berufsschüler:innen. Erkläre die folgende Karteikarte in 2–4 kurzen, " +
      "leicht verständlichen Sätzen auf Deutsch, gern mit einem Alltagsbeispiel oder einer Eselsbrücke. Keine Überschriften, kein Markdown.\n\n" +
      "Fach: " + cc.deck.name + "\nFrage: " + c.q + "\nAntwort: " + c.a;
    aiText(prompt).then(function(text){
      if (S.session !== s) return;
      s.explain[c.id] = { text: String(text || "").trim() || "Keine Erklärung erhalten." };
      if (sessionCard() && sessionCard().card === c) renderLearn();
    }).catch(function(err){
      if (S.session !== s) return;
      delete s.explain[c.id];
      if (sessionCard() && sessionCard().card === c) renderLearn();
      toast(aiErrorMessage(err && err.code));
    });
  }

  function itemsFor(decks, which){
    var items = [];
    decks.forEach(function(d){ d.cards.forEach(function(c){
      if (which === "due" && !isDue(c)) return;
      if (which === "unknown" && c.mastered) return;
      items.push({ deckId: d.id, cardId: c.id });
    }); });
    return items;
  }

  // ======================================================================
  // Sheets, menus, toast
  // ======================================================================
  var lastFocus = null;
  function openSheet(id, data, trigger){
    closeMenu();
    if (S.sheet) closeSheet(true);
    lastFocus = trigger || document.activeElement;
    S.sheet = Object.assign({ id: id }, data || {});
    var ov = $("overlays");
    ov.innerHTML = '<div class="scrim" data-action="close-sheet"></div><div class="sheet glass sq" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet"></div>';
    var sheet = $("sheet");
    if (trigger && trigger.getBoundingClientRect){
      var r = trigger.getBoundingClientRect();
      var w = Math.min(560, window.innerWidth), left = (window.innerWidth - w) / 2;
      var h = Math.min(window.innerHeight * .86, 860), top = (window.innerHeight - h) / 2;
      sheet.style.setProperty("--ox", (r.left + r.width / 2 - left) + "px");
      sheet.style.setProperty("--oy", (r.top + r.height / 2 - top) + "px");
    }
    renderSheetBody();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      ov.querySelector(".scrim").classList.add("show"); sheet.classList.add("show");
    }); });
    setTimeout(function(){ var f = sheet.querySelector("[autofocus]") || sheet.querySelector("input, textarea, button"); if (f) f.focus(); }, 80);
  }
  function closeSheet(immediate){
    if (!S.sheet) return;
    if (S.sheet.id === "gen" && S.gen && S.gen.abort) { try { S.gen.abort.abort(); } catch (e) {} }
    S.sheet = null;
    var ov = $("overlays");
    var sh = ov.querySelector(".sheet"), sc = ov.querySelector(".scrim");
    if (immediate){ ov.innerHTML = ""; return; }
    if (sh) sh.classList.remove("show");
    if (sc) sc.classList.remove("show");
    setTimeout(function(){ if (!S.sheet) ov.innerHTML = ""; }, reducedMotion ? 260 : 450);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function sheetHead(title, left, right){
    return '<div class="sheet-head"><div class="l">' + (left || "") + '</div><h2 id="sheetTitle">' + esc(title) + '</h2><div class="r">' + (right || "") + '</div></div>';
  }
  function renderSheetBody(){
    var sh = S.sheet, el = $("sheet");
    if (!sh || !el) return;
    var renderers = { deck: sheetDeck, card: sheetCard, gen: sheetGen, confirm: sheetConfirm };
    el.innerHTML = renderers[sh.id](sh);
  }

  // deck editor
  function sheetDeck(sh){
    var d = sh.deckId ? getDeck(sh.deckId) : null;
    var name = sh.name != null ? sh.name : (d ? d.name : "");
    var color = sh.color || (d ? d.color : "blue");
    sh.name = name; sh.color = color;
    return sheetHead(d ? "Fach bearbeiten" : "Neues Fach",
        '<button class="hbtn" data-action="close-sheet">Abbrechen</button>',
        '<button class="hbtn primary" data-action="save-deck" id="saveDeckBtn"' + (name.trim() ? "" : " disabled") + '>' + (d ? "Sichern" : "Anlegen") + '</button>') +
      '<div class="sheet-body">' +
        '<div><label class="field-label" for="deckName">Name</label><div class="group"><input class="field" id="deckName" maxlength="40" placeholder="z. B. Rechnungswesen" value="' + esc(name) + '" autofocus autocomplete="off"></div></div>' +
        '<div><span class="field-label" id="colorLbl">Farbe</span><div class="group"><div class="swatches" role="radiogroup" aria-labelledby="colorLbl">' +
          COLORS.map(function(c){
            return '<button class="swatch" role="radio" aria-checked="' + (c === color) + '" aria-label="' + COLOR_NAMES[c] + '" data-action="pick-color" data-color="' + c + '" style="background:var(--c-' + c + ')">' + (c === color ? icon("check") : "") + '</button>';
          }).join("") + '</div></div></div>' +
        (d ? '<div class="group"><button class="row destructive" data-action="confirm-delete-deck">' + icon("trash") + 'Fach löschen</button></div>' : '') +
      '</div>';
  }

  // card editor
  function sheetCard(sh){
    var d = getDeck(sh.deckId), c = sh.cardId ? getCard(d, sh.cardId) : null;
    if (sh.q == null){ sh.q = c ? c.q : ""; sh.a = c ? c.a : ""; }
    var media = c && c.media && !sh.removeMedia ? c.media : null;
    var mediaHtml = "";
    if (media){
      var inner = media.kind === "photo" && safeUrl(media.url) ? '<img src="' + esc(safeUrl(media.url)) + '" alt="">' : (sanitizeSvg(media.markup) || "");
      if (inner) mediaHtml = '<div><span class="field-label">Bild</span><div class="group"><div class="draft-media" style="border-top:none"><div class="box">' + inner + '</div>' +
        '<button class="btn small danger" data-action="remove-media">' + icon("trash") + (media.kind === "svg" ? "Zeichnung entfernen" : "Bild entfernen") + '</button></div></div></div>';
    }
    var valid = sh.q.trim() && sh.a.trim();
    return sheetHead(c ? "Karte bearbeiten" : "Neue Karte",
        '<button class="hbtn" data-action="close-sheet">' + (c ? "Abbrechen" : "Fertig") + '</button>',
        '<button class="hbtn primary" data-action="save-card" id="saveCardBtn"' + (valid ? "" : " disabled") + '>' + (c ? "Sichern" : "Hinzufügen") + '</button>') +
      '<div class="sheet-body">' +
        '<div><label class="field-label" for="cardQ">Frage</label><div class="group"><textarea class="field" id="cardQ" rows="2" maxlength="300" placeholder="Was möchtest du gefragt werden?" autofocus>' + esc(sh.q) + '</textarea></div></div>' +
        '<div><label class="field-label" for="cardA">Antwort</label><div class="group"><textarea class="field" id="cardA" rows="3" maxlength="500" placeholder="Die richtige Antwort">' + esc(sh.a) + '</textarea></div></div>' +
        mediaHtml +
        (c ? '<div class="group">' +
              (c.mastered || c.box > 1 ? '<button class="row accent-row" data-action="reset-card" style="justify-content:center">' + icon("rotate") + 'Lernstand zurücksetzen</button>' : '') +
              '<button class="row destructive" data-action="delete-card-sheet">' + icon("trash") + 'Karte löschen</button></div>'
           : '<p class="status" id="cardStatus" aria-live="polite">' + esc(sh.status || "") + '</p>') +
      '</div>';
  }

  // AI generator
  function sheetGen(sh){
    var g = S.gen;
    var d = getDeck(sh.deckId);
    var body = "";
    if (g.draft.length){
      var hasNoSvg = g.draft.some(function(x){ return !x.svg; });
      body += '<div class="banner">' + icon("sparkles") + '<span>' + plural(g.draft.length, "Karte", "Karten") + ' vorgeschlagen. Prüfe sie, ändere was nötig ist, und übernimm sie in „' + esc(d ? d.name : "") + '“.</span></div>';
      body += g.draft.map(function(x, i){
        return '<div class="group draft"><button class="rm" data-action="draft-remove" data-i="' + i + '" aria-label="Vorschlag ' + (i + 1) + ' entfernen">' + icon("xmark") + '</button>' +
          '<label class="sr" for="dq' + i + '">Frage ' + (i + 1) + '</label><textarea class="field" id="dq' + i + '" data-draft="q" data-i="' + i + '" rows="2" style="font-weight:600">' + esc(x.q) + '</textarea>' +
