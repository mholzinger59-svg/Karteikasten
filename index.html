<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!-- APP:START -->
<title>Karteikasten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iPhone = large title + inset-grouped content + floating glass tab bar;
   iPad/Mac (>=900px) = floating glass sidebar + content under glass toolbar buttons.
   Glass only on the function layer (bars, floating buttons, menus, sheets, viewer controls). */
:root{
  /* semantic system colors, light */
  --bg:#F2F2F7;               /* systemGroupedBackground */
  --bg-2:#FFFFFF;             /* secondarySystemGroupedBackground */
  --bg-3:#F2F2F7;             /* tertiarySystemGroupedBackground */
  --fill:rgba(120,120,128,.16);
  --fill-2:rgba(120,120,128,.10);
  --label:#000000;
  --label-2:rgba(60,60,67,.76);
  --label-3:rgba(60,60,67,.42);
  --separator:rgba(60,60,67,.24);
  --accent:#0071E3;           /* systemBlue, contrast-adjusted for 4.5:1 */
  --on-accent:#FFFFFF;
  --accent-soft:rgba(0,113,227,.12);
  --green:#1F8A3B;
  --red:#D70015;
  --orange:#C25E00;
  --dim:rgba(0,0,0,.22);
  --viewer-bg:#FFFFFF;
  --paper-shadow:0 1px 2px rgba(0,0,0,.05), 0 12px 40px rgba(0,0,0,.08);
  /* glass */
  --glass-fill:rgba(255,255,255,.58);
  --glass-fill-strong:rgba(250,250,252,.86);
  --glass-edge:rgba(255,255,255,.85);
  --glass-rim:rgba(0,0,0,.06);
  --glass-shadow:0 8px 30px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
  --glass-blur:blur(18px) saturate(190%);
  /* deck (content) colors */
  --c-blue:#007AFF; --c-green:#28A745; --c-orange:#FF9500; --c-red:#FF3B30; --c-purple:#AF52DE;
  --c-pink:#FF2D55; --c-teal:#30B0C7; --c-indigo:#5856D6; --c-yellow:#E6B800; --c-gray:#8E8E93;
  /* type (Dynamic Type via rem; 1rem = Body 17pt) */
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-serif:"New York", ui-serif, Georgia, serif;
  --t-large:2rem; --t-title1:1.647rem; --t-title2:1.294rem; --t-title3:1.176rem;
  --t-body:1rem; --t-callout:.941rem; --t-sub:.882rem; --t-foot:.765rem; --t-cap:.706rem; --t-cap2:.647rem;
  /* geometry */
  --r-sheet:34px; --r-group:22px; --r-card:28px; --r-ctl:12px;
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-bounce:cubic-bezier(.34,1.36,.64,1);
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --kb:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
    --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.24);
    --label:#FFFFFF; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.36);
    --separator:rgba(84,84,88,.65);
    --accent:#0A84FF; --on-accent:#FFFFFF; --accent-soft:rgba(10,132,255,.2);
    --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --dim:rgba(0,0,0,.45);
    --viewer-bg:#000000; --paper-shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
    --glass-fill:rgba(44,44,48,.52); --glass-fill-strong:rgba(36,36,40,.9);
    --glass-edge:rgba(255,255,255,.16); --glass-rim:rgba(0,0,0,.4);
    --glass-shadow:0 8px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
    --c-blue:#0A84FF; --c-green:#30D158; --c-orange:#FF9F0A; --c-red:#FF453A; --c-purple:#BF5AF2;
    --c-pink:#FF375F; --c-teal:#40C8E0; --c-indigo:#5E5CE6; --c-yellow:#FFD60A; --c-gray:#98989D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
  --fill:rgba(120,120,128,.36); --fill-2:rgba(120,120,128,.24);
  --label:#FFFFFF; --label-2:rgba(235,235,245,.66); --label-3:rgba(235,235,245,.36);
  --separator:rgba(84,84,88,.65);
  --accent:#0A84FF; --on-accent:#FFFFFF; --accent-soft:rgba(10,132,255,.2);
  --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --dim:rgba(0,0,0,.45);
  --viewer-bg:#000000; --paper-shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
  --glass-fill:rgba(44,44,48,.52); --glass-fill-strong:rgba(36,36,40,.9);
  --glass-edge:rgba(255,255,255,.16); --glass-rim:rgba(0,0,0,.4);
  --glass-shadow:0 8px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
  --c-blue:#0A84FF; --c-green:#30D158; --c-orange:#FF9F0A; --c-red:#FF453A; --c-purple:#BF5AF2;
  --c-pink:#FF375F; --c-teal:#40C8E0; --c-indigo:#5E5CE6; --c-yellow:#FFD60A; --c-gray:#98989D;
  color-scheme:dark;
}
/* Glass intensity: "getönt" = more opaque fill */
:root[data-glass="tinted"]{ --glass-fill:rgba(255,255,255,.84); }
@media (prefers-color-scheme: dark){ :root[data-glass="tinted"]:not([data-theme="light"]){ --glass-fill:rgba(36,36,40,.86); } }
:root[data-glass="tinted"][data-theme="dark"]{ --glass-fill:rgba(36,36,40,.86); }
@media (prefers-contrast: more){
  :root{ --label-2:rgba(60,60,67,.92); --separator:rgba(60,60,67,.5); --glass-rim:rgba(0,0,0,.35); --glass-fill:rgba(255,255,255,.92); --accent:#0040DD; }
  :root[data-theme="dark"]{ --label-2:rgba(235,235,245,.85); --separator:rgba(140,140,148,.8); --glass-rim:rgba(255,255,255,.4); --glass-fill:rgba(28,28,30,.95); --accent:#409CFF; }
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* touch-action: no double-tap zoom anywhere; pinch zoom only inside the image viewer */
html{ font-size:17px; -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
@supports (font: -apple-system-body){ html{ font:-apple-system-body; } }
body{
  margin:0; min-height:100%;
  background:var(--bg); color:var(--label);
  font-family:var(--font); font-size:var(--t-body); line-height:1.3;
  -webkit-font-smoothing:antialiased; touch-action:manipulation;
}
button, input, textarea, select{ font:inherit; color:inherit; }
/* 16px minimum keeps iOS from zooming into focused fields */
input, textarea, select{ font-size:max(16px, var(--t-body)); }
button{ cursor:pointer; }
img{ -webkit-user-drag:none; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:inherit; }
.sr{ position:absolute!important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
svg.i{ width:1.25em; height:1.25em; flex:none; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
svg.i .f{ fill:currentColor; stroke:none; }

/* ---------- Liquid Glass (function layer only) ---------- */
.glass{
  background:var(--glass-fill);
  -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 var(--glass-edge), inset 0 0 0 .5px var(--glass-rim), var(--glass-shadow);
}
@media (prefers-reduced-transparency: reduce){
  .glass{ background:var(--bg-2) !important; -webkit-backdrop-filter:none; backdrop-filter:none; }
}
@supports (corner-shape: squircle){ .sq{ corner-shape:squircle; } }

/* ---------- app frame ---------- */
#app{ min-height:100vh; }
.content{
  padding-left:var(--gutter-l); padding-right:var(--gutter-r);
  padding-block:calc(env(safe-area-inset-top, 0px) + 56px) calc(env(safe-area-inset-bottom, 0px) + 120px);
}
.content-inner{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:28px; }
.large-title{
  font-family:var(--font-display); font-size:var(--t-large); font-weight:700; letter-spacing:.01em;
  margin:0; line-height:1.15; text-wrap:balance; overflow-wrap:anywhere;
}
.title-block{ display:flex; flex-direction:column; gap:4px; }
.subtitle{ color:var(--label-2); font-size:var(--t-sub); margin:0; }

/* nav bar: floating glass controls + scroll-edge softening (no glass slab) */
.navbar{
  position:fixed; top:0; left:0; right:0; z-index:30;
  padding:calc(env(safe-area-inset-top, 0px) + 6px) var(--gutter-r) 6px var(--gutter-l);
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px;
  pointer-events:none;
}
.navbar::before{
  content:""; position:absolute; inset:0 0 -24px 0; z-index:-1; pointer-events:none;
  background:linear-gradient(var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 55%, transparent);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent);
  opacity:0; transition:opacity .25s ease;
}
.navbar.scrolled::before{ opacity:1; }
.nav-lead, .nav-trail{ display:flex; gap:8px; pointer-events:auto; }
.nav-trail{ justify-content:flex-end; }
.nav-title{
  font-weight:600; font-size:17px; text-align:center; opacity:0; transform:translateY(6px);
  transition:opacity .2s ease, transform .3s var(--spring); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:52vw;
}
.navbar.scrolled .nav-title{ opacity:1; transform:none; }
.gbtn{
  min-width:44px; height:44px; border-radius:22px; border:none; padding:0 12px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--label);
  font-weight:500; font-size:17px; transition:transform .35s var(--spring-bounce), opacity .2s;
}
.gbtn:active{ transform:scale(.92); }
.gbtn:disabled{ opacity:.35; }
.gbtn.accent{ color:var(--accent); }
.gbtn svg.i{ width:22px; height:22px; }
.ggroup{ display:inline-flex; border-radius:22px; }
.ggroup .gbtn{ background:transparent; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; }

/* tab bar (iPhone): glass capsule + separate search circle; fixed sizes like the system bar */
.tabbar-wrap{
  position:fixed; z-index:40; left:0; right:0; bottom:0;
  padding:0 var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gutter-l);
  display:flex; align-items:flex-end; justify-content:center; gap:10px; pointer-events:none;
}
.tabbar{ pointer-events:auto; display:flex; gap:2px; padding:4px; border-radius:32px; transition:padding .35s var(--spring); }
.tab{
  border:none; background:transparent; border-radius:28px; min-width:76px; min-height:54px; padding:6px 10px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--label); font-size:11px; font-weight:600; transition:background .25s ease, min-height .35s var(--spring), min-width .35s var(--spring);
}
.tab svg.i{ width:25px; height:25px; }
.tab[aria-selected="true"]{ color:var(--accent); background:var(--fill-2); }
.search-orb{ pointer-events:auto; width:62px; height:62px; border-radius:31px; border:none; display:flex; align-items:center; justify-content:center; color:var(--label); transition:width .35s var(--spring), height .35s var(--spring); }
.search-orb svg.i{ width:25px; height:25px; }
.tabbar-wrap.min .tab{ min-height:40px; min-width:56px; }
.tabbar-wrap.min .tab span{ display:none; }
.tabbar-wrap.min .search-orb{ width:48px; height:48px; }
.searchbar{ pointer-events:auto; flex:1; max-width:560px; display:flex; align-items:center; gap:8px; height:52px; border-radius:26px; padding:0 8px 0 16px; }
.searchbar input{ flex:1; min-width:0; border:none; background:transparent; outline:none; height:44px; }
.searchbar input::placeholder{ color:var(--label-2); }
.searchbar svg.i{ color:var(--label-2); }
/* with the keyboard open the tab bar steps aside; only the search field rides above the keyboard */
.tabbar-wrap.kb:not(.searching){ opacity:0; pointer-events:none; }
.tabbar-wrap.kb.searching{ padding-bottom:calc(var(--kb) + 8px); }
.auth-form{ display:flex; flex-direction:column; gap:16px; }
.pw-row{ position:relative; border-top:.5px solid var(--separator); }
.group > .pw-row:first-child{ border-top:none; }
.pw-row .field{ padding-right:56px; }
.pw-toggle{ position:absolute; right:4px; top:50%; transform:translateY(-50%); width:44px; height:44px; border:none; border-radius:22px; background:transparent; color:var(--label-2); display:flex; align-items:center; justify-content:center; }

/* sidebar (iPad/Mac) */
.sidebar{ display:none; }
@media (min-width:900px){
  .sidebar{
    display:flex; flex-direction:column; gap:14px; position:fixed; z-index:35;
    top:calc(env(safe-area-inset-top, 0px) + 10px); bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
    left:max(10px, env(safe-area-inset-left, 0px)); width:290px; border-radius:26px; padding:14px 10px; overflow:auto;
  }
  .tabbar-wrap{ display:none; }
  .content{ padding-left:calc(max(10px, env(safe-area-inset-left, 0px)) + 290px + 32px); padding-right:32px; padding-bottom:48px; }
  .navbar{ left:calc(max(10px, env(safe-area-inset-left, 0px)) + 290px); padding-left:22px; padding-right:22px; }
  .only-narrow{ display:none !important; }
}
@media (max-width:899.98px){ .only-wide{ display:none !important; } }
.side-search{ display:flex; align-items:center; gap:8px; height:40px; border-radius:20px; padding:0 12px; background:var(--fill-2); margin:0 4px; }
.side-search input{ flex:1; min-width:0; border:none; background:transparent; outline:none; }
.side-search svg.i{ color:var(--label-2); }
.side-section{ display:flex; flex-direction:column; gap:2px; }
.side-head{ font-size:var(--t-foot); font-weight:600; color:var(--label-2); padding:8px 12px 4px; }
.side-item{
  border:none; background:transparent; text-align:left; display:flex; align-items:center; gap:10px;
  min-height:44px; padding:8px 12px; border-radius:14px; font-size:var(--t-body); color:var(--label); width:100%;
}
.side-item:hover{ background:var(--fill-2); }
.side-item[aria-current="true"]{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
.side-item .count{ margin-left:auto; color:var(--label-2); font-size:var(--t-sub); font-variant-numeric:tabular-nums; }
.side-item svg.i{ color:var(--accent); }
.side-item .deck-icon svg.i{ color:#fff; }
.side-item[aria-current="true"] .count{ color:var(--accent); }
.side-item .txt{ min-width:0; overflow-wrap:anywhere; }

/* ---------- content layer ---------- */
.section{ display:flex; flex-direction:column; gap:8px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:4px 12px; padding:0 4px; flex-wrap:wrap; }
.section-head h2{ margin:0; font-family:var(--font-display); font-size:var(--t-title3); font-weight:700; }
.section-head .meta{ color:var(--label-2); font-size:var(--t-sub); }
.section-foot{ color:var(--label-2); font-size:var(--t-foot); padding:0 16px; margin:0; line-height:1.4; }
.group{ background:var(--bg-2); border-radius:var(--r-group); overflow:hidden; }
.row{
  position:relative; display:flex; align-items:center; gap:12px; min-height:52px; padding:11px 16px;
  width:100%; border:none; background:var(--bg-2); text-align:left; color:var(--label);
}
button.row:active{ background:var(--fill-2); }
.row + .row::before, .card-row + .card-row::before, .row + .card-row::before, .card-row + .row::before, .tree-row + .row::before{
  content:""; position:absolute; top:0; right:0; left:var(--sep-inset, 16px); height:.5px; background:var(--separator); z-index:2;
}
.row .grow{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.row .t{ font-size:var(--t-body); overflow-wrap:anywhere; }
.row .t.strong{ font-weight:600; }
.row .s{ font-size:var(--t-sub); color:var(--label-2); overflow-wrap:anywhere; }
.row .s.clamp{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row .trail{ color:var(--label-2); font-size:var(--t-body); display:flex; align-items:center; gap:6px; flex:none; font-variant-numeric:tabular-nums; }
.row .chev{ color:var(--label-3); width:1rem; height:1rem; }
.row.accent-row{ color:var(--accent); }
.row.destructive{ color:var(--red); justify-content:center; }
.row-meta{ display:flex; gap:4px 10px; flex-wrap:wrap; margin-top:2px; font-size:var(--t-foot); color:var(--label-2); align-items:center; }
.row-meta .img-count{ display:inline-flex; align-items:center; gap:3px; }
.row-meta svg.i{ width:1.1em; height:1.1em; }
mark{ background:color-mix(in srgb, var(--accent) 22%, transparent); color:inherit; border-radius:3px; padding:0 1px; }
.deck-icon{ width:2.1rem; height:2.1rem; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; }
.deck-icon svg.i{ width:1.2rem; height:1.2rem; stroke-width:2.1; }
.deck-row{ --sep-inset:calc(16px + 2.1rem + 12px); }
/* collapsible category tree */
.tree-row{ position:relative; display:flex; align-items:stretch; background:var(--bg-2); padding-left:calc(var(--depth, 0) * 22px); }
.tree-row > .row{ flex:1; min-width:0; padding-left:2px; }
.tree-row + .tree-row::before{
  content:""; position:absolute; top:0; right:0; height:.5px; background:var(--separator); z-index:2;
  left:calc(var(--depth, 0) * 22px + 44px + 2px + 2.1rem + 12px);
}
.disclose{ flex:none; width:44px; border:none; background:transparent; color:var(--accent); display:flex; align-items:center; justify-content:center; padding:0 0 0 6px; }
.disclose.none{ pointer-events:none; }
.disclose:active{ background:var(--fill-2); }
.disclose svg.i{ width:1rem; height:1rem; transition:transform .3s var(--spring-bounce); }
.disclose[aria-expanded="true"] svg.i{ transform:rotate(90deg); }
.tree-row.enter{ animation:tree-in .32s var(--spring-bounce) both; }
@keyframes tree-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
.link-btn{ border:none; background:transparent; color:var(--accent); font-size:var(--t-sub); font-weight:500; min-height:44px; padding:0 4px; margin:-12px 0; }
.side-row{ display:flex; align-items:stretch; }
.side-row > .side-item{ flex:1; min-width:0; padding-left:4px; }
.side-disc{ width:34px; padding:0; border-radius:12px; }
.mini-progress{ height:4px; border-radius:2px; background:var(--fill); overflow:hidden; margin-top:6px; }
.mini-progress > i{ display:block; height:100%; border-radius:2px; background:var(--green); }
.pill{ display:inline-flex; align-items:center; gap:4px; font-size:var(--t-foot); font-weight:600; padding:3px 9px; border-radius:99px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; }

/* buttons (content layer: filled / tinted / plain, no glass) */
.btn{
  border:none; min-height:50px; padding:12px 20px; border-radius:25px; font-weight:600; font-size:var(--t-body);
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center;
  background:var(--fill-2); color:var(--accent); transition:transform .35s var(--spring-bounce), opacity .2s;
}
.btn:active{ transform:scale(.96); }
.btn.filled{ background:var(--accent); color:var(--on-accent); }
.btn.danger{ color:var(--red); }
.btn.filled.danger{ background:var(--red); color:#fff; }
.btn.small{ min-height:44px; padding:8px 16px; font-size:var(--t-sub); border-radius:22px; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:default; transform:none; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn-row > .btn{ flex:1 1 160px; }

/* today hero (content) */
.today{ background:var(--bg-2); border-radius:var(--r-card); padding:20px; display:flex; flex-direction:column; gap:18px; }
.today-top{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.ring{ width:5.4rem; height:5.4rem; flex:none; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .track{ stroke:var(--fill); }
.ring .val{ stroke:var(--accent); transition:stroke-dashoffset .8s var(--spring); }
.ring .lbl{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
.ring .lbl b{ font-size:var(--t-title2); font-family:var(--font-display); line-height:1; }
.ring .lbl small{ font-size:var(--t-cap2); color:var(--label-2); }
.today-facts{ flex:1; min-width:12rem; display:flex; flex-direction:column; gap:6px; }
.today-facts .big{ font-family:var(--font-display); font-size:var(--t-title2); font-weight:700; margin:0; }
.today-facts p{ margin:0; color:var(--label-2); font-size:var(--t-sub); }
.fact-line{ display:flex; align-items:center; gap:6px; color:var(--label-2); font-size:var(--t-sub); }
.fact-line svg.i{ color:var(--orange); }

/* stats */
.stage-bars{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; align-items:end; height:76px; }
.stage-bars .b{ display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.stage-bars .b i{ display:block; width:100%; max-width:42px; border-radius:6px 6px 3px 3px; background:var(--accent); min-height:3px; }
.stage-bars .b span{ font-size:var(--t-cap2); color:var(--label-2); font-variant-numeric:tabular-nums; }
.stats-card{ background:var(--bg-2); border-radius:var(--r-card); padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(8.5rem,1fr)); gap:12px; }
.stat{ background:var(--bg-2); border-radius:var(--r-group); padding:14px 16px; display:flex; flex-direction:column; gap:2px; }
.stat b{ font-family:var(--font-display); font-size:var(--t-title1); font-weight:700; font-variant-numeric:tabular-nums; }
.stat span{ color:var(--label-2); font-size:var(--t-sub); }
.progress{ height:8px; border-radius:4px; background:var(--fill); overflow:hidden; }
.progress > i{ display:block; height:100%; background:var(--green); border-radius:4px; transition:width .6s var(--spring); }
.progress-line{ display:flex; justify-content:space-between; gap:8px; color:var(--label-2); font-size:var(--t-sub); flex-wrap:wrap; }
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:end; height:150px; }
.week .d{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; }
.week .d i{ display:block; width:100%; max-width:34px; border-radius:7px 7px 3px 3px; background:var(--fill); min-height:4px; }
.week .d.has i{ background:var(--accent); }
.week .d.today span{ color:var(--label); font-weight:700; }
.week .d span{ font-size:var(--t-cap); color:var(--label-2); }
.week .d em{ font-style:normal; font-size:var(--t-cap2); color:var(--label-2); font-variant-numeric:tabular-nums; min-height:1em; }

/* card rows: tap to edit, "…" (or long press / right click) for actions, selection mode for several */
.card-row{ position:relative; display:flex; align-items:stretch; background:var(--bg-2); -webkit-touch-callout:none; }
.card-row .row{ flex:1; min-width:0; padding-right:4px; -webkit-user-select:none; user-select:none; }
.card-row.pressed .row{ background:var(--fill-2); }
.row-more{ flex:none; width:52px; border:none; background:transparent; color:var(--label-2); display:flex; align-items:center; justify-content:center; }
.row-more:active{ background:var(--fill-2); }
.sel-dot{ width:26px; height:26px; border-radius:50%; border:2px solid var(--label-3); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; }
.sel-dot svg.i{ width:16px; height:16px; stroke-width:3; opacity:0; }
.card-row.selected .sel-dot{ background:var(--accent); border-color:var(--accent); }
.card-row.selected .sel-dot svg.i{ opacity:1; }
.card-row.selected .row{ background:var(--accent-soft); }
.select-bar-wrap{ position:fixed; z-index:41; left:0; right:0; bottom:0; display:flex; justify-content:center;
  padding:0 var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gutter-l); pointer-events:none; }
.select-bar{ pointer-events:auto; display:flex; align-items:center; gap:4px; padding:6px; border-radius:30px; width:100%; max-width:560px; }
.select-bar .count{ flex:1; text-align:center; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
.select-bar .btn{ min-height:46px; padding:8px 16px; border-radius:23px; font-size:15px; background:transparent; }
.select-bar .btn.danger:not(:disabled){ color:var(--red); }
@media (min-width:900px){ .select-bar-wrap{ left:calc(max(10px, env(safe-area-inset-left, 0px)) + 290px); } }
.card-thumb{ position:relative; width:3rem; height:3rem; border-radius:10px; overflow:hidden; flex:none; background:#fff; box-shadow:inset 0 0 0 .5px var(--separator); }
.card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.known-mark{ color:var(--green); display:inline-flex; align-items:center; gap:3px; font-weight:600; }

.empty{ text-align:center; padding:36px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; background:var(--bg-2); border-radius:var(--r-card); }
.empty .glyph{ width:3.6rem; height:3.6rem; color:var(--label-3); }
.empty h3{ margin:0; font-size:var(--t-title3); font-family:var(--font-display); }
.empty p{ margin:0; color:var(--label-2); max-width:30rem; line-height:1.45; }
.empty.compact{ padding:24px 16px; }
.banner{ background:var(--accent-soft); color:var(--label); border-radius:var(--r-group); padding:14px 16px; display:flex; gap:12px; align-items:flex-start; font-size:var(--t-sub); line-height:1.4; }
.banner svg.i{ color:var(--accent); margin-top:1px; }
.loading{ display:flex; align-items:center; gap:10px; color:var(--label-2); padding:6px 4px; font-size:var(--t-sub); }
.spinner{ width:1.1rem; height:1.1rem; border-radius:50%; border:2.5px solid var(--fill); border-top-color:var(--label-2); animation:spin .8s linear infinite; flex:none; }
.btn.filled .spinner{ border-color:rgba(255,255,255,.35); border-top-color:#fff; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* segmented control */
.seg{ display:flex; background:var(--fill-2); border-radius:12px; padding:3px; gap:2px; }
.seg button{ flex:1; border:none; background:transparent; min-height:38px; border-radius:10px; font-size:var(--t-sub); font-weight:500; color:var(--label); padding:4px 8px; }
.seg button[aria-checked="true"]{ background:var(--bg-2); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.12); }
.group .seg{ margin:0; }

/* ---------- learn (full-screen cover) ---------- */
.learn{
  position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) calc(env(safe-area-inset-bottom, 0px) + 12px) var(--gutter-l);
  transform:translateY(100%); transition:transform .55s var(--spring); overflow:hidden;
}
.learn.open{ transform:none; }
.learn-top{ display:flex; align-items:center; gap:10px; max-width:760px; width:100%; margin:0 auto; }
.learn-top .mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; align-items:center; }
.learn-top .mid b{ font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.learn-top .mid small{ font-size:13px; color:var(--label-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.learn-top .progress{ width:100%; height:4px; }
.learn-top .progress > i{ background:var(--accent); }
.learn-stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:14px 0; perspective:1600px; min-height:0; }
/* the wrapper is a flex column capped at the stage height, so the card shrinks to the free space and scrolls inside */
.flip-wrap{ position:relative; width:100%; max-width:680px; max-height:100%; display:flex; flex-direction:column; transition:transform .45s var(--spring), opacity .3s ease; }
.flip-wrap.dragging{ transition:none; }
.face{
  flex:0 1 auto; min-height:min(42vh, 22rem); max-height:100%; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  background:var(--bg-2); border-radius:var(--r-card); padding:24px; cursor:pointer; touch-action:pan-y;
  display:flex; flex-direction:column; gap:14px; box-shadow:var(--paper-shadow);
  transition:transform .24s cubic-bezier(.2,.8,.3,1), opacity .14s ease;
}
.face.turn-out{ transform:rotateY(90deg); transition:transform .17s cubic-bezier(.5,0,.9,.5); }
.face.turn-in{ transform:rotateY(-90deg); transition:none; }
.face.fade{ opacity:0; }
/* more text below: soft fade at the bottom edge until scrolled to the end */
.face.more{ -webkit-mask-image:linear-gradient(#000 calc(100% - 56px), transparent); mask-image:linear-gradient(#000 calc(100% - 56px), transparent); }
.face .eyebrow{ font-size:var(--t-foot); font-weight:600; color:var(--label-2); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.face .eyebrow .dot{ width:.6rem; height:.6rem; border-radius:50%; }
.face .text{ flex:1 0 auto; display:flex; align-items:center; font-family:var(--font-serif); font-size:var(--t-title2); line-height:1.4; overflow-wrap:anywhere; white-space:pre-wrap; }
.face .text.long{ font-size:var(--t-title3); line-height:1.45; }
.face .text.xlong{ font-size:max(16px, var(--t-callout)); line-height:1.55; align-items:flex-start; }
.face .hint{ text-align:center; color:var(--label-2); font-size:var(--t-foot); }
.face-media{ display:grid; gap:8px; grid-template-columns:1fr; }
.face-media.multi{ grid-template-columns:1fr 1fr; }
.media-btn{ position:relative; border:none; padding:0; border-radius:16px; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; cursor:zoom-in; box-shadow:inset 0 0 0 .5px var(--separator); min-height:44px; }
.media-btn img{ display:block; max-width:100%; width:100%; height:auto; max-height:34vh; object-fit:contain; }
.face-media.multi .media-btn img{ height:18vh; max-height:none; object-fit:contain; }
.zoom-chip{ position:absolute; right:8px; bottom:8px; width:32px; height:32px; border-radius:16px; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.zoom-chip svg.i{ width:18px; height:18px; stroke-width:2.2; }
.explain{ background:var(--fill-2); border-radius:16px; padding:12px 14px; font-size:var(--t-callout); line-height:1.45; color:var(--label); white-space:pre-wrap; }
.swipe-label{ position:absolute; top:18px; z-index:5; font-weight:700; font-size:15px; padding:6px 12px; border-radius:99px; opacity:0; display:flex; gap:6px; align-items:center; pointer-events:none; background:var(--bg-2); box-shadow:0 2px 10px rgba(0,0,0,.12); }
.swipe-label.known{ right:18px; color:var(--green); }
.swipe-label.again{ left:18px; color:var(--orange); }
.learn-bottom{ display:flex; justify-content:center; }
.answer-bar{ display:flex; gap:6px; padding:6px; border-radius:36px; width:100%; max-width:520px; }
.answer-bar .btn{ flex:1; min-height:56px; border-radius:30px; }
.answer-bar .btn.again{ background:transparent; color:var(--label); }
.kbd-hint{ text-align:center; color:var(--label-2); font-size:12px; margin:8px 0 0; }
@media (hover:none){ .kbd-hint{ display:none; } }
.done{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; max-width:460px; margin:0 auto; width:100%; }
.done .seal{ width:5rem; height:5rem; border-radius:50%; background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green); display:flex; align-items:center; justify-content:center; }
.done .seal svg.i{ width:2.6rem; height:2.6rem; stroke-width:2.4; }
.done h2{ margin:0; font-family:var(--font-display); font-size:var(--t-title1); }
.done p{ margin:0; color:var(--label-2); }
.done .stat-grid{ width:100%; }
.done .btn{ width:100%; }

/* ---------- sheets, menus, toasts (function layer) ---------- */
.scrim{ position:fixed; inset:0; z-index:80; background:var(--dim); opacity:0; transition:opacity .35s ease; }
.scrim.show{ opacity:1; }
.sheet{
  position:fixed; z-index:81; left:max(8px, env(safe-area-inset-left, 0px)); right:max(8px, env(safe-area-inset-right, 0px));
  bottom:calc(max(env(safe-area-inset-bottom, 0px), var(--kb)) + 8px);
  max-height:calc(var(--vvh, 100vh) - env(safe-area-inset-top, 0px) - 24px);
  border-radius:var(--r-sheet); display:flex; flex-direction:column; overflow:hidden;
  transform:translateY(110%); transition:transform .5s var(--spring), opacity .3s ease, bottom .25s ease;
}
.sheet.glass{ background:var(--glass-fill-strong); }
.sheet.show{ transform:none; }
.sheet.dragging{ transition:none; }
.grabber{ width:40px; height:5px; border-radius:3px; background:var(--label-3); margin:8px auto 0; flex:none; }
@media (min-width:700px){
  .sheet{ left:50%; right:auto; width:580px; bottom:auto; top:50%; max-height:min(88vh, 900px);
    transform:translate(-50%,-50%) scale(.6); opacity:0; transform-origin:var(--ox, 50%) var(--oy, 50%); }
  .sheet.show{ transform:translate(-50%,-50%); opacity:1; }
  .grabber{ display:none; }
}
.sheet-head{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; padding:8px 12px 8px; touch-action:none; }
.sheet-head h2{ margin:0; font-size:17px; font-weight:600; text-align:center; }
.sheet-head .l{ justify-self:start; } .sheet-head .r{ justify-self:end; }
.hbtn{ border:none; background:var(--fill-2); color:var(--label); min-height:44px; min-width:44px; padding:0 14px; border-radius:22px; font-weight:500; font-size:17px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.hbtn.primary{ background:var(--accent); color:var(--on-accent); font-weight:600; }
.hbtn:disabled{ opacity:.4; }
.sheet-body{ overflow:auto; padding:8px 16px 20px; display:flex; flex-direction:column; gap:20px; overscroll-behavior:contain; }
.sheet .group{ border-radius:18px; }   /* concentric: 34 sheet − 16 inset */
.field{ display:block; width:100%; border:none; background:var(--bg-2); padding:14px 16px; outline:none; resize:none; min-height:52px; line-height:1.4; }
.field::placeholder{ color:var(--label-3); }
textarea.field{ min-height:5.2rem; overflow:hidden; }
.group .field + .field{ border-top:.5px solid var(--separator); }
.field-label{ font-size:var(--t-foot); color:var(--label-2); padding:0 16px 6px; display:flex; justify-content:space-between; gap:8px; }
.discard-bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:color-mix(in srgb, var(--red) 10%, var(--bg-2)); border-radius:18px; padding:12px 14px; }
.discard-bar span{ flex:1 1 10rem; font-weight:600; }
.discard-bar .btn{ flex:1 1 8rem; }
.swatches{ display:flex; flex-wrap:wrap; gap:10px; padding:14px 16px; background:var(--bg-2); }
.swatch{ width:44px; height:44px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1); }
.swatch[aria-checked="true"]{ outline:3px solid var(--label); outline-offset:3px; }
.toggle{ position:relative; width:52px; height:32px; flex:none; }
.toggle input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
.toggle i{ position:absolute; inset:0; border-radius:16px; background:var(--fill); transition:background .25s; }
.toggle i::after{ content:""; position:absolute; top:2px; left:2px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); transition:transform .35s var(--spring-bounce); }
.toggle input:checked + i{ background:var(--green); }
.toggle input:checked + i::after{ transform:translateX(20px); }
.toggle input:focus-visible + i{ outline:3px solid var(--accent); outline-offset:2px; }
.stepper{ display:flex; background:var(--fill-2); border-radius:10px; overflow:hidden; flex:none; }
.stepper button{ border:none; background:transparent; width:46px; height:36px; font-size:1.2rem; color:var(--label); }
.stepper button + button{ border-left:.5px solid var(--separator); }

/* image tiles (editor, generator, drafts) */
.media-strip{ display:flex; flex-wrap:wrap; gap:10px; padding:12px 16px 14px; border-top:.5px solid var(--separator); background:var(--bg-2); }
.media-strip.drop{ background:var(--accent-soft); }
.tile{ position:relative; width:88px; height:88px; border-radius:14px; flex:none; }
.tile .tile-img{ width:100%; height:100%; border:none; padding:0; border-radius:14px; overflow:hidden; background:#fff; box-shadow:inset 0 0 0 .5px var(--separator); cursor:zoom-in; display:block; }
.tile .tile-img img{ width:100%; height:100%; object-fit:cover; display:block; }
.tile.primary .tile-img{ outline:3px solid var(--accent); outline-offset:2px; }
.tile-btn{ position:absolute; width:30px; height:30px; border-radius:15px; border:none; background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; }
.tile-btn::after{ content:""; position:absolute; inset:-7px; }   /* 44pt hit area */
.tile-btn svg.i{ width:15px; height:15px; stroke-width:2.6; }
.tile-btn.x{ top:-6px; right:-6px; }
.tile-btn.mv{ bottom:4px; left:4px; }
.tile-label{ position:absolute; left:4px; bottom:4px; border:none; border-radius:99px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; font-weight:600; padding:5px 8px; min-height:26px; }
.tile-add{ width:88px; height:88px; border-radius:14px; border:1.5px dashed var(--label-3); background:transparent; color:var(--accent); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:13px; font-weight:600; }
.tile-add svg.i{ width:24px; height:24px; }
.tile-busy{ width:88px; height:88px; border-radius:14px; background:var(--fill-2); display:flex; align-items:center; justify-content:center; }
.strip-hint{ font-size:var(--t-foot); color:var(--label-2); padding:0 16px 12px; background:var(--bg-2); margin:-6px 0 0; }
.draft{ position:relative; }
.draft .field:first-of-type{ padding-right:56px; }
a.btn{ text-decoration:none; }
.draft textarea.field{ min-height:52px; }
#chatPrompt{ min-height:0; height:7.5rem !important; overflow:auto !important; font-size:max(16px, var(--t-sub)); color:var(--label-2); }
.draft .rm{ position:absolute; top:6px; right:6px; z-index:2; width:44px; height:44px; border:none; border-radius:22px; background:transparent; color:var(--label-2); display:flex; align-items:center; justify-content:center; }
.status{ font-size:var(--t-sub); color:var(--label-2); min-height:1.2em; margin:0; line-height:1.4; }
.status.err{ color:var(--red); }

.menu{
  position:fixed; z-index:130; min-width:240px; max-width:min(320px, calc(100vw - 24px)); border-radius:22px; padding:6px;
  display:flex; flex-direction:column; transform:scale(.4); opacity:0; transition:transform .4s var(--spring), opacity .2s ease;
  max-height:calc(100vh - 24px); overflow:auto;
}
.menu.glass{ background:var(--glass-fill-strong); }
.menu.show{ transform:none; opacity:1; }
.menu button{ border:none; background:transparent; display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:44px; padding:10px 14px; border-radius:16px; font-size:17px; text-align:left; color:var(--label); }
.menu button:hover, .menu button:focus-visible{ background:var(--fill-2); }
.menu button.destructive{ color:var(--red); }
.menu hr{ border:none; height:.5px; background:var(--separator); margin:4px 10px; }
.menu .menu-head{ font-size:13px; color:var(--label-2); padding:8px 14px 4px; }
.toast{
  position:fixed; z-index:140; left:50%; top:calc(env(safe-area-inset-top, 0px) + 10px);
  transform:translate(-50%, -160%); transition:transform .5s var(--spring);
  display:flex; align-items:center; gap:10px; padding:6px 6px 6px 18px; min-height:48px; border-radius:24px; width:max-content; max-width:calc(100vw - 32px);
  font-size:15px; font-weight:500;
}
.toast.show{ transform:translate(-50%, 0); }
/* with a sheet open the toast moves to the bottom, clear of the sheet's buttons */
body.has-sheet .toast{ top:auto; bottom:calc(max(env(safe-area-inset-bottom, 0px), var(--kb)) + 16px); transform:translate(-50%, 180%); }
body.has-sheet .toast.show{ transform:translate(-50%, 0); }
.toast .btn{ min-height:36px; padding:6px 14px; font-size:15px; }
.toast.no-action{ padding-right:18px; }

/* ---------- image viewer ---------- */
.viewer{ position:fixed; inset:0; z-index:120; }
.viewer-bg{ position:absolute; inset:0; background:var(--viewer-bg); opacity:0; transition:opacity .35s ease; }
.viewer.open .viewer-bg{ opacity:1; }
.viewer-stage{ position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:zoom-in; }
.viewer-stage.zoomed{ cursor:grab; }
.viewer-img{ position:absolute; left:0; top:0; max-width:none; object-fit:contain; user-select:none; -webkit-user-select:none; background:#fff; }
.viewer-img.anim{ transition:transform .42s var(--spring), width .42s var(--spring), height .42s var(--spring), opacity .3s ease; }
.viewer-top{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top, 0px) + 8px) var(--gutter-r) 0 var(--gutter-l); transition:opacity .25s ease; pointer-events:none; }
.viewer-top > *{ pointer-events:auto; }
.viewer-count{ min-height:44px; padding:0 16px; border-radius:22px; display:flex; align-items:center; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }

  function relTime(t){

  var writeChains = {}, pendingWrites = {};

    var body = {};
    (fields || ["cards"]).forEach(function(f){ body[f] = clone(deck[f]); });
    if (body.cards && JSON.stringify(body).length > 250000){
      toast("„" + deck.name + "“ ist zu groß zum Sichern. Teile es auf zwei Fächer auf.");
    }
    pendingWrites[deck.id] = (pendingWrites[deck.id] || 0) + 1;
    var prev = writeChains[deck.id] || Promise.resolve();
    var next = prev.catch(noop).then(function(){
      return S.db.doc("decks/" + deck.id).update(body);
    }).catch(function(err){
      console.error("Speichern fehlgeschlagen", err);
      toast("Änderung konnte nicht gesichert werden. Prüfe deine Verbindung.");

  function bootStorage(){

          S.decks = snap.docs.map(function(doc){
            var data = doc.data() || {};
            var existing = getDeck(doc.id);
            // While our own writes for this deck are in flight, keep the local
            // cards: an older echo must not overwrite newer answers.
            if (existing && pendingWrites[doc.id] > 0) return existing;
            var cards = [];
            if (Array.isArray(data.cards)){ try { cards = JSON.parse(JSON.stringify(data.cards)); } catch (e) { cards = []; } }
            return normalizeDeck({ id: doc.id, name: data.name || "Ohne Namen", color: data.color, cards: cards, categoryId: data.categoryId || null, createdAt: data.createdAt || "" });
          });

            if (S.stats.days[t] && (!merged[t] || merged[t].r < S.stats.days[t].r)) merged[t] = S.stats.days[t];

    var cur = null, mode = null, found = false;
    lines.forEach(function(l){
      var c = cleanLine(l);
      if (QRE.test(c)){ if (cur) add(cur.q, cur.a); cur = { q: c.replace(QRE, ""), a: "" }; mode = "q"; found = true; return; }
      if (cur && ARE.test(c)){ cur.a = c.replace(ARE, ""); mode = "a"; return; }
      if (!c){ if (mode === "a") mode = "gap"; return; }     // text after a blank line (e.g. a closing remark) is ignored
      if (cur && mode === "q") cur.q += (cur.q ? "\n" : "") + c;
      else if (cur && mode === "a") cur.a += (cur.a ? "\n" : "") + c;
    });
    if (cur) add(cur.q, cur.a);
    if (found && out.length) return out;
    out = [];
    // 3. Markdown table | Frage | Antwort |
    var rows = lines.filter(function(l){ return /^\s*\|.*\|\s*$/.test(l); });
    if (rows.length >= 2){
      var numCol = false;
      rows.forEach(function(r, i){
        var cells = r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cleanLine);
        if (cells.every(function(x){ return !x || /^:?-{2,}:?$/.test(x); })) return;
        // header row: skip it, and note a leading number column
        if (i === 0 && cells.some(function(x){ return /^(frage|antwort|question|answer|begriff|erklärung|vorderseite|rückseite|term|definition)$/i.test(x); })){
          numCol = /^(nr\.?|#|no\.?|nummer)$/i.test(cells[0]); return;
        }
        var qi = numCol || (cells.length >= 3 && /^\d+$/.test(cells[0])) ? 1 : 0;
        add(cells[qi], cells[qi + 1]);
      });
      if (out.length) return out;
    }
    // 4. one card per line (Quizlet/Anki exports, "Begriff – Erklärung" lists)
    var nonEmpty = lines.map(function(l){ return l.trim(); }).filter(Boolean);
    var seps = ["\t", ";", " – ", " — ", " - ", " = ", ": "];
    for (var k = 0; k < seps.length; k++){
      var sep = seps[k];
      var hits = nonEmpty.filter(function(l){ return l.indexOf(sep) > 0; });
      if (hits.length >= 2 && hits.length >= nonEmpty.length * 0.6){
        hits.forEach(function(l){ var i = l.indexOf(sep); add(cleanLine(l.slice(0, i)), cleanLine(l.slice(i + sep.length))); });
        if (out.length) return out;
      }
    }
    // 5. a question line ending in "?" followed by its answer
    for (var j = 0; j < nonEmpty.length - 1; j++){
      if (/\?\s*$/.test(nonEmpty[j]) && !/\?\s*$/.test(nonEmpty[j + 1])){ add(cleanLine(nonEmpty[j]), cleanLine(nonEmpty[j + 1])); j++; }
    }
    return out;
  }

  function hl(text, q){
    text = String(text || "");
    if (!q) return esc(text);
    var lo = text.toLowerCase(), out = "", i = 0, j;
    while ((j = lo.indexOf(q, i)) > -1){ out += esc(text.slice(i, j)) + "<mark>" + esc(text.slice(j, j + q.length)) + "</mark>"; i = j + q.length; }
    return out + esc(text.slice(i));
  }
  function cardLabel(c, side){

    return n ? (n === 1 ? "Bild" : n + " Bilder") : "";

  var AUTH_TEXT = {

  function setAuthMsg(){

  function submitAuth(){

    var mail = $("authEmail") ? $("authEmail").value.trim() : "", pw = $("authPw").value;

  // ======================================================================

  function shuffleArr(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    var el = $("learn");
    el.hidden = false;

  function sideLists(c){

  function renderLearnHeader(){

  function renderLearn(){
    var s = S.session, el = $("learn");
    if (!s) return;
    while (s.idx < s.queue.length && !(sessionCard() && sessionCard().card)) s.queue.splice(s.idx, 1);
    if (s.idx >= s.queue.length) s.done = true;

    var total = s.queue.length, pos = Math.min(s.idx + 1, total);
    var pct = total ? Math.round((s.done ? total : s.idx) / total * 100) : 100;
    var top = '<div class="learn-top">' +
      '<button class="gbtn glass" data-action="close-learn" aria-label="Lernen beenden">' + icon("xmark") + '</button>' +
      '<div class="mid"><b>' + (s.done ? "Fertig" : pos + " von " + total) + '</b><small>' + esc(s.title) + '</small>' +
        '<div class="progress" aria-hidden="true"><i style="width:' + pct + '%"></i></div></div>' +
      '<button class="gbtn glass" data-action="undo" aria-label="Letzte Antwort rückgängig"' + (s.history.length ? "" : " disabled") + '>' + icon("undo") + '</button>' +
    '</div>';

    if (s.done){

        '<div class="stat-grid"><div class="stat sq"><b style="color:var(--green)">' + s.known + '</b><span>gewusst</span></div><div class="stat sq"><b style="color:var(--orange)">' + s.again + '</b><span>nochmal</span></div></div>' +
        (again.length ? '<button class="btn" data-action="learn-again">' + icon("repeat") + 'Nicht gewusste wiederholen · ' + again.length + '</button>' : '') +
        '<button class="btn filled" data-action="close-learn">Fertig</button></div>';
      var fin = el.querySelector(".btn.filled"); if (fin) setTimeout(function(){ fin.focus(); }, 50);
      return;

    el.innerHTML = top +
      '<div class="learn-stage"><div class="flip-wrap" id="flipWrap">' +

        '<span class="swipe-label again" id="lblAgain">' + icon("repeat") + 'Nochmal</span>' +

      '</div></div>' +

  // Content of the side currently shown; long texts get a smaller size.
  function faceInner(){
    var s = S.session, cc = sessionCard(), d = cc.deck, c = cc.card, sides = sideLists(c), back = s.flipped;
    var lbl = back ? (settings.reverse ? "Frage" : "Antwort") : (settings.reverse ? "Antwort" : "Frage");
    var txt = back ? sides.bt : sides.ft, len = txt.trim().length;

      faceMediaHtml(back ? sides.back : sides.front, back ? "back" : "front") +
      (txt.trim() ? '<div class="text' + size + '">' + esc(txt) + '</div>' : '') +
      (back ? (expl ? '<div class="explain">' + (expl.busy ? '<span class="loading" style="padding:0"><span class="spinner"></span>Claude erklärt …</span>' : esc(expl.text)) + '</div>'

  function updateMoreHint(){

  function answerBarHtml(flipped){

      : '<button class="btn filled" data-action="flip">Antwort zeigen</button>';

  // The card turns on its edge, swaps its content at 90° and turns back.
  function flipCard(){
    var s = S.session; if (!s || s.done || s.turning) return;
    s.flipped = !s.flipped;
    $("answerBar").innerHTML = answerBarHtml(s.flipped);
    haptic(5);
    var f = $("flipCard"); if (!f) return;
    function swap(){ f.innerHTML = faceInner(); f.scrollTop = 0; updateMoreHint(); }
    if (reducedMotion){ f.classList.add("fade"); setTimeout(function(){ swap(); f.classList.remove("fade"); }, 140); return; }
    s.turning = true;
    f.classList.add("turn-out");
    setTimeout(function(){
      swap();
      f.classList.remove("turn-out"); f.classList.add("turn-in");
      f.getBoundingClientRect();
      f.classList.remove("turn-in");
      setTimeout(function(){ s.turning = false; }, 240);
    }, 170);
  }

  function answer(known, viaSwipe){
    var s = S.session; if (!s || s.done || s.busy) return;
    var cc = sessionCard(); if (!cc || !cc.card) return;
    var c = cc.card, d = cc.deck;
    var entry = { deckId: d.id, cardId: c.id, prev: { box: c.box, due: c.due, mastered: c.mastered }, known: known, requeued: false, wasAgain: !!s.againIds[c.id] };
    if (known){
      c.box = Math.min(5, c.box + 1);
      c.due = addDays(today(), INTERVALS[c.box]);
      c.mastered = true;
      s.known++;
      delete s.againIds[c.id];
    } else {
      c.box = 1; c.due = today(); c.mastered = false;
      s.again++;
      s.againIds[c.id] = d.id;
      var n = s.requeued[c.id] || 0;
      if (n < 2){ s.queue.push({ deckId: d.id, cardId: c.id }); s.requeued[c.id] = n + 1; entry.requeued = true; }
    }
    s.history.push(entry);
    bumpStats(known, 1);
    saveDeck(d, ["cards"]);
    haptic(known ? 10 : [6, 40, 6]);
    var go = function(){ s.busy = false; s.idx++; s.flipped = false; renderLearn(); var f = $("flipCard"); if (f) f.focus(); };
    var wrap = $("flipWrap");
    if (wrap && !reducedMotion){
      s.busy = true;
      var dir = known ? 1 : -1;
      wrap.style.transform = "translateX(" + (dir * 120) + "%) rotate(" + (dir * 12) + "deg)";
      wrap.style.opacity = "0";
      setTimeout(go, viaSwipe ? 220 : 260);
    } else go();
  }

  function undo(){
    var s = S.session; if (!s || !s.history.length || s.busy) return;
    var h = s.history.pop();
    var d = getDeck(h.deckId), c = getCard(d, h.cardId);
    if (c){ c.box = h.prev.box; c.due = h.prev.due; c.mastered = h.prev.mastered; saveDeck(d, ["cards"]); }
    if (h.requeued){
      for (var i = s.queue.length - 1; i > s.idx - 1; i--){ if (s.queue[i].cardId === h.cardId){ s.queue.splice(i, 1); break; } }
      s.requeued[h.cardId] = Math.max(0, (s.requeued[h.cardId] || 1) - 1);
    }
    if (h.known){ s.known--; if (h.wasAgain) s.againIds[h.cardId] = h.deckId; }
    else { s.again--; if (!h.wasAgain) delete s.againIds[h.cardId]; }
    bumpStats(h.known, -1);
    s.done = false;
    s.idx = Math.max(0, s.idx - 1);
    s.flipped = true;

  }

  function wireCardDrag(){
    var wrap = $("flipWrap"), card = $("flipCard");
    if (!wrap || !card) return;
    var sx = 0, sy = 0, dx = 0, active = false, moved = false, pid = null;
    var lk = $("lblKnown"), la = $("lblAgain");
    card.addEventListener("pointerdown", function(e){
      if (e.button !== 0 || e.target.closest("button")) return;
      sx = e.clientX; sy = e.clientY; dx = 0; active = true; moved = false; pid = e.pointerId;
    });
    card.addEventListener("pointermove", function(e){
      if (!active || e.pointerId !== pid) return;
      var mx = e.clientX - sx, my = e.clientY - sy;
      if (!moved && Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)){
        if (!S.session.flipped){ active = false; return; } // judge only after seeing the answer
        moved = true; wrap.classList.add("dragging");
        try { card.setPointerCapture(pid); } catch (err) {}
      }
      if (!moved) return;
      dx = mx;
      wrap.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 24) + "deg)";
      var p = Math.min(1, Math.abs(dx) / 110);
      lk.style.opacity = dx > 0 ? p : 0; la.style.opacity = dx < 0 ? p : 0;
    });
    function end(){
      if (!active) return;
      active = false;
      if (!moved) return;
      wrap.classList.remove("dragging");
      lk.style.opacity = 0; la.style.opacity = 0;
      if (Math.abs(dx) > 110) answer(dx > 0, true);
      else wrap.style.transform = "";
      card.dataset.justDragged = "1";
      setTimeout(function(){ delete card.dataset.justDragged; }, 50);
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", function(){ active = false; wrap.classList.remove("dragging"); wrap.style.transform = ""; lk.style.opacity = 0; la.style.opacity = 0; });
    card.addEventListener("click", function(e){
      if (card.dataset.justDragged || e.target.closest("button")) return;
      flipCard();
    });
    card.addEventListener("keydown", function(e){
      if (e.key === "Enter" && e.target === card){ e.preventDefault(); flipCard(); }
    });
    card.addEventListener("scroll", updateMoreHint, { passive: true });
  }

  function explainCurrent(){
    var s = S.session; var cc = sessionCard(); if (!cc || !cc.card) return;
    var c = cc.card;
    s.explain[c.id] = { busy: true };
    renderLearn();
    var prompt = "Du bist eine geduldige Lernhilfe für Berufsschüler:innen. Erkläre die folgende Karteikarte in 2–4 kurzen, " +
      "leicht verständlichen Sätzen auf Deutsch, gern mit einem Alltagsbeispiel oder einer Eselsbrücke. Keine Überschriften, kein Markdown.\n\n" +
      "Fach: " + cc.deck.name + "\nFrage: " + (c.q || "(nur Bild)") + "\nAntwort: " + (c.a || "(nur Bild)") +

  }

  function itemsFor(decks, which){

  }

  function deleteCardsWithUndo(d, ids){
    if (!d || !ids || !ids.length) return;
    var gone = [];   // [index, card] in original order, so undo restores positions
    d.cards.forEach(function(c, i){ if (ids.indexOf(c.id) > -1) gone.push([i, c]); });
    if (!gone.length) return;
    d.cards = d.cards.filter(function(c){ return ids.indexOf(c.id) < 0; });
    saveDeck(d, ["cards"]);
    renderShell();
    haptic(12);
    var undone = false;
    toast(gone.length === 1 ? "Karte gelöscht" : plural(gone.length, "Karte", "Karten") + " gelöscht", "Widerrufen", function(){
      undone = true;
      var dd = getDeck(d.id); if (!dd) return;
      gone.forEach(function(g){ dd.cards.splice(Math.min(g[0], dd.cards.length), 0, g[1]); });
      saveDeck(dd, ["cards"]); renderShell();
    });
    // pictures go once the undo window has passed
    setTimeout(function(){ if (!undone) gone.forEach(function(g){ cardMedia(g[1]).forEach(discardIfUnused); }); }, 6000);
  }

  function exportMedia(m){
    if (m.kind === "svg") return Promise.resolve({ kind: "svg", markup: m.markup, alt: m.alt || "" });
    var base = { kind: "image", type: m.type || "", w: m.w || 0, h: m.h || 0, alt: m.alt || "" };
    var p;
    if (m.ref) p = Local.getImage(m.ref);
    else {
      var src = mediaSrc(m);
      if (!src) return Promise.resolve(null);
      if (/^data:/.test(src)){ base.data = src; return Promise.resolve(base); }
      p = fetch(src).then(function(r){ return r.ok ? r.blob() : null; });
    }
    return p.then(function(b){
      if (!b) return null;
      return blobToDataUrl(b).then(function(dataUrl){ base.data = dataUrl; base.type = base.type || b.type; return base; });
    }).catch(function(){ return null; });
  }
  function exportData(){
    if (!S.decks.length && !S.cats.length){ toast("Es gibt noch nichts zu sichern."); return; }
    toast("Sicherung wird erstellt …");
    var decks = [];
    S.decks.reduce(function(p, d){
      return p.then(function(){
        var cards = [];
        return d.cards.reduce(function(pc, c){
          return pc.then(function(){
            return Promise.all([Promise.all(c.qMedia.map(exportMedia)), Promise.all(c.aMedia.map(exportMedia))]).then(function(r){
              cards.push({ q: c.q, a: c.a, mastered: c.mastered, box: c.box, due: c.due, qMedia: r[0].filter(Boolean), aMedia: r[1].filter(Boolean) });
            });
          });
        }, Promise.resolve()).then(function(){ decks.push({ name: d.name, color: d.color, categoryId: d.categoryId || null, cards: cards }); });
      });
    }, Promise.resolve()).then(function(){
      var cats = S.cats.map(function(k){ return { id: k.id, name: k.name, color: k.color, parentId: k.parentId || null }; });
      var json = JSON.stringify({ app: "karteikasten", version: 4, exportedAt: new Date().toISOString(), categories: cats, decks: decks, stats: S.stats });
      var filename = "karteikasten-" + today() + ".json";
      if (S.downloads){
        return S.downloads.save({ filename: filename, data: json }).then(function(){ toast("Sicherung gespeichert"); }).catch(function(err){
          if (err && err.code === "cancelled") return;
          toast("Sicherung konnte nicht gespeichert werden.");
        });
      }
      if (IS_ARTIFACT){ toast("Herunterladen ist in dieser Ansicht nicht möglich."); return; }
      var blob = new Blob([json], { type: "application/json" });
      var file = new File([blob], filename, { type: "application/json" });
      // iPhone/iPad: share sheet ("In Dateien sichern"); elsewhere a normal download
      function download(){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        toast("Sicherung gespeichert (" + fmtBytes(blob.size) + ")");
      }
      if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|iPod/.test(navigator.userAgent)){
        return navigator.share({ files: [file], title: "Karteikasten-Sicherung" }).catch(function(err){ if (!err || err.name !== "AbortError") download(); });
      }
      download();
    }).catch(function(err){ console.error(err); toast("Sicherung fehlgeschlagen. Versuch es erneut."); });
  }
  var importLost = 0;
  function importMedia(m){
    if (!m || typeof m !== "object") return Promise.resolve(null);
    if (m.kind === "svg"){ var s = sanitizeSvg(m.markup); return Promise.resolve(s ? { id: uid(), kind: "svg", markup: s, alt: m.alt || "Grafik" } : null); }
    var data = m.data || (/^data:image\//.test(m.url || "") ? m.url : null);
    if (data){
      var blob;
      try { blob = dataUrlToBlob(data); } catch (e) { importLost++; return Promise.resolve(null); }
      return storeImage({ blob: blob, type: m.type || blob.type, w: m.w, h: m.h }, m.alt || "").catch(function(){ importLost++; return null; });
    }
    var u = safeUrl(m.url || m.src);
    if (u && /^https?:/.test(u)) return Promise.resolve({ id: uid(), kind: "photo", url: u, alt: m.alt || "" });
    importLost++;
    return Promise.resolve(null);
  }
  function importFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); } catch (e) { toast("Die Datei ist keine gültige Sicherung."); return; }
      var decks = data && Array.isArray(data.decks) ? data.decks : (Array.isArray(data) ? data : null);
      if (!decks){ toast("In der Datei wurden keine Fächer gefunden."); return; }
      toast("Sicherung wird importiert …");
      importLost = 0;
      // categories get new ids; parents are created before their children
      var catMap = {}, srcCats = Array.isArray(data.categories) ? data.categories.filter(function(k){ return k && k.id; }) : [];
      for (var pass = 0; pass < 20 && Object.keys(catMap).length < srcCats.length; pass++){
        srcCats.forEach(function(k){
          if (catMap[k.id] || (k.parentId && !catMap[k.parentId] && srcCats.some(function(x){ return x.id === k.parentId; }))) return;
          catMap[k.id] = createCat({ name: String(k.name || "Kategorie"), color: k.color, parentId: k.parentId ? catMap[k.parentId] && catMap[k.parentId].id : null });
        });
      }
      decks.reduce(function(p, d){
        return p.then(function(){
          var cards = [];
          return (Array.isArray(d.cards) ? d.cards : []).reduce(function(pc, c){
            return pc.then(function(){
              if (!c) return;
              var qm = (c.qMedia || []).slice(), am = (c.aMedia || []).slice();
              if (c.media) am.unshift(c.media);
              return Promise.all([Promise.all(qm.map(importMedia)), Promise.all(am.map(importMedia))]).then(function(r){
                var nc = normalizeCard({ id: uid(), q: String(c.q || "").slice(0, 600), a: String(c.a || "").slice(0, 1200), mastered: !!c.mastered, box: c.box, due: c.due,
                  qMedia: r[0].filter(Boolean), aMedia: r[1].filter(Boolean) });
                if ((nc.q.trim() || nc.qMedia.length) && (nc.a.trim() || nc.aMedia.length)) cards.push(nc);
              });
            });
          }, Promise.resolve()).then(function(){ return createDeck({ name: String(d.name || "Importiert").slice(0, 40), color: colorKey(d.color), categoryId: d.categoryId && catMap[d.categoryId] ? catMap[d.categoryId].id : null, cards: cards }); });
        });
      }, Promise.resolve()).then(function(){
        renderShell();
        toast(plural(decks.length, "Fach", "Fächer") + " importiert" + (importLost ? " · " + plural(importLost, "Bild", "Bilder") + " ließen sich nicht übernehmen" : ""));
      }).catch(function(err){ console.error(err); toast("Import fehlgeschlagen. Versuch es erneut."); });
    };
    reader.readAsText(file);
  }

  document.addEventListener("click", function(e){
    if (S.menu){
      var mi = e.target.closest("[data-menu]");
      var trig = S.menu.trigger;
      closeMenu();
      if (mi){ menuActions[mi.getAttribute("data-menu")](trig, mi.getAttribute("data-arg")); return; }
      if (trig && trig.contains && trig.contains(e.target)) return;
    }
    if (e.target.closest(".viewer, .sketch")) return;
    var el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    var fn = actions[el.getAttribute("data-action")];
    if (fn){ e.preventDefault(); fn(el, e); }
  });
  document.addEventListener("input", function(e){
    var t = e.target;
    if (t.id === "sideSearch" || t.id === "tabSearch"){
      S.query = t.value;
      if (S.tab !== "search"){ S.tab = "search"; S.deckId = null; renderSidebar(); renderTabbar(); }
      renderView();
      return;
    }
    if (t.tagName === "TEXTAREA" && t.classList.contains("field")) autosize(t);
    if (!S.sheet){
      if (t.id === "apiKey"){ settings.apiKey = t.value.trim(); saveSettings(); }
      if (t.id === "syncUrl" || t.id === "syncKey"){ settings[t.id] = t.value.trim(); saveSettings(); }

      return;
    }
    if (t.id === "authEmail" || t.id === "authPw"){ S.sheet[t.id === "authEmail" ? "email" : "pw"] = t.value; if (S.sheet.err){ S.sheet.err = ""; setAuthMsg(); } }
    if (t.id === "catName"){ S.sheet.name = t.value; S.sheet.dirty = true; $("saveCatBtn").disabled = !t.value.trim(); }
    if (t.id === "deckName"){ S.sheet.name = t.value; S.sheet.dirty = true; $("saveDeckBtn").disabled = !t.value.trim(); }
    if (t.id === "cardQ" || t.id === "cardA"){
      S.sheet[t.id === "cardQ" ? "q" : "a"] = t.value; S.sheet.dirty = true;
      updateSaveCardBtn();
      var st = $("cardStatus"); if (st && st.textContent){ st.textContent = ""; S.sheet.status = ""; }
    }
    if (t.getAttribute("data-gen") === "text") S.gen.text = t.value;
    if (t.getAttribute("data-gen") === "paste"){ S.gen.paste = t.value; if (S.gen.error){ S.gen.error = ""; } }
    if (t.hasAttribute("data-draft")) S.gen.draft[+t.getAttribute("data-i")][t.getAttribute("data-draft")] = t.value;
  });
  document.addEventListener("submit", function(e){
    if (e.target && e.target.id === "authForm"){ e.preventDefault(); submitAuth(); }
  });
  document.addEventListener("change", function(e){
    var t = e.target;
    if (t.hasAttribute("data-setting")){ settings[t.getAttribute("data-setting")] = t.checked; saveSettings(); }
    if (t.getAttribute("data-gen") === "attach") S.gen.attach = t.checked;
    if (t.id === "mediaInput"){ var files = Array.prototype.slice.call(t.files || []); t.value = ""; addFilesToSide(files, S.mediaSide); }
    if (t.id === "photoInput"){ var pf = Array.prototype.slice.call(t.files || []); t.value = ""; addGenPhotos(pf); }
    if (t.id === "importInput"){ if (t.files && t.files[0]) importFile(t.files[0]); t.value = ""; }
  });
  document.addEventListener("keydown", function(e){
    if (Viewer.isOpen()){ Viewer.key(e); return; }
    if (Sketch.isOpen()){ Sketch.key(e); return; }
    if (S.menu){
      if (e.key === "Escape"){ e.preventDefault(); closeMenu(true); return; }
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        var btns = Array.prototype.slice.call(S.menu.el.querySelectorAll("button"));
        var i = btns.indexOf(document.activeElement);
        i = e.key === "ArrowDown" ? (i + 1) % btns.length : (i - 1 + btns.length) % btns.length;
        btns[i].focus(); e.preventDefault();
      }
      if (e.key === "Tab"){ e.preventDefault(); closeMenu(true); }
      return;
    }
    if (S.sheet){
      if (e.key === "Escape"){ e.preventDefault(); requestCloseSheet(); return; }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)){
        var p = document.querySelector("#sheet .hbtn.primary, #sheet [data-action='gen-run']");
        if (p && !p.disabled) p.click();
      }
      if (e.key === "Enter" && e.target.id === "authEmail"){ e.preventDefault(); var pwf = $("authPw"); if (pwf) pwf.focus(); return; }
      if (e.key === "Enter" && e.target.id === "catName"){ e.preventDefault(); var cb = $("saveCatBtn"); if (cb && !cb.disabled) cb.click(); return; }
      if (e.key === "Enter" && e.target.id === "deckName"){ e.preventDefault(); var sb = $("saveDeckBtn"); if (sb && !sb.disabled) sb.click(); }
      if (e.key === "Tab") trapFocus(e, $("sheet"));
      return;
    }
    if (S.session){
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea") return;
      if (e.key === "Escape"){ e.preventDefault(); closeSession(); return; }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); return; }
      if (S.session.done) return;
      if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
      if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown"){ e.preventDefault(); flipCard(); return; }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
        e.preventDefault();
        if (!S.session.flipped){ flipCard(); return; }
        answer(e.key === "ArrowRight");
      }
      if (e.key === "Tab") trapFocus(e, $("learn"));
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f" && isWide()){ e.preventDefault(); $("sideSearch").focus(); }
  });
  function trapFocus(e, root){
    if (!root) return;
    var f = Array.prototype.slice.call(root.querySelectorAll("button:not([disabled]), input, textarea, [tabindex='0']")).filter(function(x){ return x.offsetParent !== null || x.getClientRects().length; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  document.addEventListener("contextmenu", function(e){
    var row = e.target.closest(".card-row");
    if (!row || S.select) return;
    e.preventDefault();
    var anchor = { getBoundingClientRect: function(){ return { left: e.clientX, right: e.clientX + 1, top: e.clientY, bottom: e.clientY, width: 1, height: 1 }; },
                   focus: function(){ row.querySelector(".row").focus(); }, contains: function(){ return false; } };
    openCardMenu(row.getAttribute("data-deck"), row.getAttribute("data-card"), anchor);
  });

  // files: drag & drop and paste into the card editor or the generator
  function hasFiles(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") > -1; }
  document.addEventListener("dragover", function(e){
    if (!hasFiles(e)) return;
    e.preventDefault();
    var z = e.target.closest && e.target.closest("[data-drop]");
    document.querySelectorAll(".media-strip.drop").forEach(function(x){ if (x !== z) x.classList.remove("drop"); });
    if (z && S.sheet) z.classList.add("drop");
  });
  document.addEventListener("dragleave", function(e){ var z = e.target.closest && e.target.closest("[data-drop]"); if (z && !z.contains(e.relatedTarget)) z.classList.remove("drop"); });
  document.addEventListener("drop", function(e){
    if (!hasFiles(e)) return;
    e.preventDefault();
    var files = e.dataTransfer.files;
    if (!S.sheet || !files || !files.length) return;
    var z = e.target.closest && e.target.closest("[data-drop]");
    if (S.sheet.id === "card") addFilesToSide(files, z && z.getAttribute("data-drop") === "a" ? "a" : (z ? "q" : (document.activeElement && document.activeElement.id === "cardA" ? "a" : "q")));
    else if (S.sheet.id === "gen" && S.gen && S.gen.mode === "photo") addGenPhotos(files);
  });
  document.addEventListener("paste", function(e){
    if (e.target && e.target.id === "genPaste" && S.gen){
      setTimeout(function(){ var t = $("genPaste"); if (!t || !S.gen) return; S.gen.paste = t.value; if (parseCards(t.value).length) runPasteParse(); }, 0);
    }
  });
  document.addEventListener("paste", function(e){
    if (!S.sheet || !(S.sheet.id === "card" || (S.sheet.id === "gen" && S.gen && S.gen.mode === "photo"))) return;
    var files = Array.prototype.filter.call((e.clipboardData && e.clipboardData.files) || [], function(f){ return fileKind(f); });
    if (!files.length) return;
    e.preventDefault();
    if (S.sheet.id === "card") addFilesToSide(files, document.activeElement && document.activeElement.id === "cardA" ? "a" : "q");
    else addGenPhotos(files);
  });

  // long press (touch) on a card row opens its menu
  var press = null;
  document.addEventListener("pointerdown", function(e){
    var row = e.target.closest && e.target.closest(".card-row");
    if (!row || e.pointerType === "mouse" || S.select || e.target.closest(".row-more")) return;
    press = { row: row, x: e.clientX, y: e.clientY, id: e.pointerId, fired: false };
    press.timer = setTimeout(function(){
      if (!press) return;
      press.fired = true; row.classList.add("pressed"); haptic(10);
      openCardMenu(row.getAttribute("data-deck"), row.getAttribute("data-card"), row.querySelector(".row-more") || row);
      setTimeout(function(){ row.classList.remove("pressed"); }, 250);
    }, 480);
  });
  document.addEventListener("pointermove", function(e){
    if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10){ clearTimeout(press.timer); press = null; }
  });
  function endPress(){ if (press){ clearTimeout(press.timer); if (press.fired){ var r = press.row; r.dataset.justPressed = "1"; setTimeout(function(){ delete r.dataset.justPressed; }, 400); } press = null; } }
  document.addEventListener("pointerup", endPress);
  document.addEventListener("pointercancel", endPress);
  document.addEventListener("click", function(e){
    var row = e.target.closest && e.target.closest(".card-row");
    if (row && row.dataset.justPressed){ e.stopPropagation(); e.preventDefault(); }
  }, true);

  // sheets: drag down on the header to dismiss (iPhone)
  var sheetDrag = null;
  document.addEventListener("pointerdown", function(e){
    var head = e.target.closest && e.target.closest("#sheet .sheet-head, #sheet .grabber");
    if (!head || e.target.closest("button") || window.matchMedia("(min-width: 700px)").matches) return;
    sheetDrag = { y: e.clientY, dy: 0, t: Date.now(), id: e.pointerId, el: $("sheet") };
  });
  document.addEventListener("pointermove", function(e){
    var d = sheetDrag; if (!d || e.pointerId !== d.id) return;
    d.dy = Math.max(0, e.clientY - d.y);
    if (d.dy > 4){ d.el.classList.add("dragging"); d.el.style.transform = "translateY(" + d.dy + "px)"; }
  });
  function endSheetDrag(e){
    var d = sheetDrag; if (!d || e.pointerId !== d.id) return;
    sheetDrag = null;
    d.el.classList.remove("dragging");
    var v = d.dy / Math.max(1, Date.now() - d.t);
    d.el.style.transform = "";
    if (d.dy > 120 || (d.dy > 40 && v > .6)) requestCloseSheet();
  }
  document.addEventListener("pointerup", endSheetDrag);
  document.addEventListener("pointercancel", endSheetDrag);

  // scroll: large title -> inline title; tab bar minimizes while scrolling down
  var lastY = 0;
  window.addEventListener("scroll", function(){
    var y = window.scrollY;
    $("navbar").classList.toggle("scrolled", y > 44);
    var tb = $("tabbarWrap");
    if (y > lastY + 6 && y > 80) tb.classList.add("min");
    else if (y < lastY - 6 || y < 40) tb.classList.remove("min");
    lastY = y;
  }, { passive: true });
  var wideMq = window.matchMedia("(min-width: 900px)");
  (wideMq.addEventListener ? wideMq.addEventListener.bind(wideMq, "change") : wideMq.addListener.bind(wideMq))(function(){ renderShell(); });
  window.addEventListener("resize", function(){ if (S.menu) closeMenu(); updateMoreHint(); });
  document.addEventListener("load", function(e){ if (e.target.tagName === "IMG" && e.target.closest && e.target.closest("#flipCard")) updateMoreHint(); }, true);
  // a new day can make cards due while the app stays open
  var lastDay = today();
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) return;
    if (today() !== lastDay){ lastDay = today(); renderShell(); }
    Sync.schedule(0);
  });
  // a reset or confirmation link opened while the app is already showing
  window.addEventListener("hashchange", function(){ if (S.loaded) checkAuthLink(); });
  // sync whenever the connection returns, and once a minute while the app is open
  window.addEventListener("online", function(){ Sync.schedule(300); });
  window.addEventListener("offline", function(){ Sync.sync(); });
  setInterval(function(){ if (!document.hidden) Sync.sync(); }, 60000);

  // ======================================================================
  // Boot
  // ======================================================================
  function start(hot){
    if (hot && hot.tab) S.tab = hot.tab;
    if (hot && hot.deckId) S.deckId = hot.deckId;
    if (hot && hot.catId) S.catId = hot.catId;
    renderShell();
    bootStorage();
  }
  if (IS_ARTIFACT && window.claude.hot && typeof window.claude.hot.snapshot === "function"){
    window.claude.hot.snapshot(function(){ return { tab: S.tab, deckId: S.deckId, catId: S.catId }; });
  }
  if (IS_ARTIFACT && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(IS_ARTIFACT && window.claude.hot ? window.claude.hot.data : null);

  if (!IS_ARTIFACT && "serviceWorker" in navigator && /^https:|^http:\/\/localhost/.test(location.href)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(noop); });
  }
})();
</script>
<!-- APP:END -->
</body>
</html>
